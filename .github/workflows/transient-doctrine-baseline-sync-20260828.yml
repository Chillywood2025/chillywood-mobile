name: Transient doctrine baseline sync 20260828

on:
  push:
    branches:
      - chatgpt/protected-main-checkpoint-repair-20260828-v2

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Sync exact doctrine baseline assertions and self-remove
        env:
          BRANCH: chatgpt/protected-main-checkpoint-repair-20260828-v2
          WORKFLOW_PATH: .github/workflows/transient-doctrine-baseline-sync-20260828.yml
        run: |
          set -euo pipefail
          git checkout "$BRANCH"
          node <<'NODE'
          const fs = require('fs');
          const path = 'tests/assurance/engineering-doctrine.test.mjs';
          let text = fs.readFileSync(path, 'utf8');
          const oldCount = 'assert.equal(graph.nodes.length, 22); assert.equal(inventory.totals.routeModules, 70);';
          const newCount = 'assert.equal(graph.nodes.length, 22); assert.equal(inventory.totals.routeModules, 72);';
          if (!text.includes(oldCount)) throw new Error('routeModules baseline assertion not found exactly');
          text = text.replace(oldCount, newCount);
          const oldList = 'assert.deepEqual(closure.includedPaths, ["tests/assurance/codex-security-reliability-s0.test.mjs", "tests/assurance/current-truth-sync.test.mjs", "tests/assurance/engineering-doctrine.test.mjs", "tests/assurance/pr-scope-feature-bundles.test.mjs"]);';
          const newList = 'assert.deepEqual(closure.includedPaths, ["tests/assurance/codex-security-reliability-s0.test.mjs", "tests/assurance/current-truth-sync.test.mjs", "tests/assurance/engineering-doctrine.test.mjs", "tests/assurance/phase1-risk-based-closure-gate.test.mjs", "tests/assurance/pr-scope-feature-bundles.test.mjs"]);';
          if (!text.includes(oldList)) throw new Error('verification closure baseline assertion not found exactly');
          text = text.replace(oldList, newList);
          fs.writeFileSync(path, text);
          NODE
          rm "$WORKFLOW_PATH"
          git diff --check
          test "$(git diff --name-only | sort)" = "$(printf '%s\n' "$WORKFLOW_PATH" tests/assurance/engineering-doctrine.test.mjs | sort)"
          git config user.name "chatgpt-codex-connector[bot]"
          git config user.email "chatgpt-codex-connector[bot]@users.noreply.github.com"
          git add tests/assurance/engineering-doctrine.test.mjs "$WORKFLOW_PATH"
          git commit -m "test: sync doctrine baseline with current inventory"
          git push origin HEAD:"$BRANCH"
