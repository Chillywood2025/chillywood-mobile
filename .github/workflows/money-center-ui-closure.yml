name: Money Center UI Closure

on:
  push:
    branches:
      - chatgpt/money-center-ui-closure
    paths:
      - .github/workflows/money-center-ui-closure.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/money-center-ui-closure
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Correct transformer proof anchor
        run: node scripts/fix-money-center-transformer-anchor.mjs

      - name: Apply Money Center UI closure
        run: node scripts/apply-money-center-ui-closure.mjs

      - name: Align Money Center guard expectations
        run: node scripts/fix-money-center-guard-expectations.mjs

      - name: Align Money Center route proof expectations
        run: node scripts/fix-money-center-route-proof-expectations.mjs

      - name: Verify Money Center policy
        run: node scripts/guard-money-center-policy.mjs

      - name: Verify creator monetization routing
        run: node scripts/proof-creator-monetization-route-button-wiring.mjs

      - name: Remove temporary repair machinery
        run: |
          rm scripts/apply-money-center-ui-closure.mjs
          rm scripts/fix-money-center-transformer-anchor.mjs
          rm scripts/fix-money-center-guard-expectations.mjs
          rm scripts/fix-money-center-route-proof-expectations.mjs
          rm .github/workflows/money-center-ui-closure.yml

      - name: Commit verified UI closure
        run: |
          git config user.name "chatgpt-codex-connector[bot]"
          git config user.email "chatgpt-codex-connector[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Clean up Money Center creator UI"
          git push origin HEAD:chatgpt/money-center-ui-closure
