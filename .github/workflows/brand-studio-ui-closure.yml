name: Brand Studio UI Closure

on:
  push:
    branches:
      - chatgpt/brand-studio-ui-closure
    paths:
      - .github/workflows/brand-studio-ui-closure.yml
      - scripts/apply-brand-studio-ui-closure.mjs

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/brand-studio-ui-closure
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply Brand Studio UI closure
        run: node scripts/apply-brand-studio-ui-closure.mjs

      - name: Verify Brand Studio policy
        run: npm run guard:platform-brand-studio-policy

      - name: Verify route contracts
        run: npm run guard:route-contracts

      - name: Remove temporary repair machinery
        run: |
          rm scripts/apply-brand-studio-ui-closure.mjs
          rm .github/workflows/brand-studio-ui-closure.yml

      - name: Commit verified Brand Studio closure
        run: |
          git config user.name "chatgpt-codex-connector[bot]"
          git config user.email "chatgpt-codex-connector[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Clean up Brand Studio creator UI"
          git push origin HEAD:chatgpt/brand-studio-ui-closure
