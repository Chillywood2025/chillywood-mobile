name: Chi'llywood Source Validation

on:
  pull_request:
    branches: [main]
    # Drafts receive full validation. Readiness alone changes no source or base.
    # After retargeting a PR to main, close/reopen it to validate the new base.
    # Do not reuse an old-base result; title/body edits intentionally do not run CI.
    # If policy validation failed pending eligible review, rerun source validation
    # after review. Marking ready neither retries checks nor grants merge authority.
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: source-validation-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  plan:
    name: Validation / Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      product: ${{ steps.plan.outputs.product }}
      sensitive: ${{ steps.plan.outputs.sensitive }}
      database: ${{ steps.plan.outputs.database }}
      nativeRelease: ${{ steps.plan.outputs.nativeRelease }}
      autonomous: ${{ steps.plan.outputs.autonomous }}
      policy: ${{ steps.plan.outputs.policy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: plan
        name: Compute conservative validation plan from the complete changed-path set
        run: node scripts/ci/required-validation.mjs --plan --base="${{ github.event.pull_request.base.sha }}"

  core:
    name: Validation / Core
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm ci --prefix ops/alert-automation
      - name: Lint, TypeScript, runtime, routes and Expo configuration
        env:
          CI: "1"
          EXPO_NO_DOTENV: "1"
          EXPO_NO_CLIENT_ENV_VARS: "1"
          EXPO_PUBLIC_SUPABASE_URL: "https://ci.invalid"
          EXPO_PUBLIC_SUPABASE_ANON_KEY: "ci-placeholder-not-a-secret"
          EXPO_PUBLIC_BETA_OPERATOR_ALLOWLIST: "ci@example.invalid"
          EXPO_PUBLIC_BETA_ENVIRONMENT: "closed-beta"
        run: |
          npm run lint
          npm run typecheck
          npm run validate:runtime
          npm run guard:route-contracts
          npm run guard:critical-ux-polish-policy
          npm run guard:pre-activation-discovery-home
          npx expo-doctor

  product:
    name: Validation / Product
    if: needs.plan.outputs.product == 'true'
    needs: plan
    # The paired call gate uses Playwright's pinned Chromium with OS libraries.
    runs-on: ubuntu-24.04
    # Hosted run 41376468605/job 125057739472 reached test 5267 without an
    # assertion failure before the 60m cutoff (59m11s in the serialized matrix).
    # Mandatory mounted/real-peer/SDK gates had not started. Bound the complete
    # pipeline plus hosted variability at 120m; retain every per-test deadline.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # Native compatibility tests verify the recorded v3 cohort at its
        # historical Git source; they never fetch or replace release receipts.
        with: { persist-credentials: false, fetch-depth: 0 }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm ci --prefix tests/integration/real-peer-browser --ignore-scripts
      - name: Prefer existing official Ubuntu HTTPS mirror
        run: |
          node scripts/ci/prefer-official-ubuntu-mirror.mjs /etc/apt/apt-mirrors.txt > "$RUNNER_TEMP/ubuntu-mirrors.txt"
          sudo install -m 0644 "$RUNNER_TEMP/ubuntu-mirrors.txt" /etc/apt/apt-mirrors.txt
      - name: Install pinned browser for real paired call negotiation
        run: node tests/integration/real-peer-browser/node_modules/playwright/cli.js install --with-deps chromium --only-shell
      - name: Install actual media renderer test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg
          ffmpeg -version
          ffprobe -version
      - name: Verify sandbox streaming in the installed browser
        timeout-minutes: 20
        run: node scripts/test-stripe-sandbox-worker-browser.mjs
      - name: Run product and navigation regression tests
        # Each SQL file owns a full disposable WASM database; serialize files
        # rather than let CPU-count defaults multiply memory unexpectedly.
        # Every file and assertion still runs; failures are never retried away.
        run: |
          node --test --test-concurrency=1 tests/*.test.mjs
          node --test tests/assurance/livekit-chat-call-mic-mounted-hook.test.mjs
          node --test tests/assurance/communication-operation-error-truth.test.mjs
          node --test tests/assurance/android-chat-call-mic-control.test.mjs
          node --test tests/assurance/chat-thread-answer-mounted.test.mjs tests/assurance/ios-native-call-bridge-mounted.test.mjs
          node --test tests/assurance/ios-foreground-call-presentation.test.mjs
          node --test tests/assurance/chat-thread-integration-mounted.test.mjs tests/assurance/chat-thread-expired-ringing-mounted.test.mjs
          node --test tests/assurance/chat-thread-call-keyboard-mounted.test.mjs
          node --test tests/assurance/chat-call-native-state-mounted.test.mjs
          node --test tests/assurance/android-legacy-audio-route-mounted.test.mjs
          node --test tests/assurance/chat-call-dispatch-integration.test.mjs
          node --test tests/assurance/chat-call-sdk-contract.test.mjs
          npm run test:communication-terminal-postgres
          npm run test:chilly-chat-real-peer
      # The official Edge SDK requires Node >=22. Keep existing product checks on Node20.
      - name: Set up isolated notification Edge SDK runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 22, cache: npm }
      - name: Install exact notification Edge SDK fixture
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix isolated-runtime/notification-edge-sdk
      - name: Test exact notification Edge SDK transport
        run: node --test tests/edge-sdk/notification-registration-sdk-transport.test.mjs

  sensitive:
    name: Validation / Sensitive
    if: needs.plan.outputs.sensitive == 'true'
    needs: plan
    runs-on: ubuntu-latest
    # Hosted run 41334686390 used 29m38s through the main Node matrix alone
    # (28m58s in that matrix), before six SQL files and retained Deno gates.
    # Budget the complete job; no individual test or provider deadline changes.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 20, cache: npm }
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with: { deno-version: v2.x }
      - run: npm ci
      - name: Run auth, entitlement, money, moderation and call authority regressions
        run: |
          deno --version
          node --test tests/local-security-probe-graph.test.mjs
          node --test --test-concurrency=1 tests/wave1/*.test.mjs tests/creator-money/*.test.mjs
          node --test --test-concurrency=1 tests/creator-room-seat-auction-engine-database.test.mjs tests/creator-room-auction-payment-database.test.mjs tests/creator-room-seat-lifecycle-database.test.mjs
          node --test --test-concurrency=1 tests/creator-auction-platform-settlement-database.test.mjs tests/creator-room-platform-settlement-database.test.mjs tests/creator-event-auction-release-database.test.mjs
          npm run guard:admin-auth-safety
          npm run guard:first-owner-authority-policy
          npm run guard:creator-monetization-policy
          npm run guard:legal-privacy-data-safety-policy
          npm run guard:malware-scanning-policy
          npm run guard:content-rights-policy
          npm run guard:money-center-policy
          npm run guard:payment-rail-policy
          npm run guard:chat-thread-hide-from-inbox-policy
          npm run guard:chilly-chat-call-push-policy
          npm run test:chilly-chat-livekit-authority
          DENO_NO_PACKAGE_JSON=1 deno test --node-modules-dir=none --no-lock --allow-read --allow-env supabase/functions/_shared/content-inspection-*.test.mjs supabase/functions/_shared/deleted-content-retention.test.mjs supabase/functions/_shared/deleted-content-media-expiry.test.mjs supabase/functions/_shared/deleted-media-retirement.test.mjs
          DENO_NO_PACKAGE_JSON=1 deno check --node-modules-dir=none --no-lock supabase/functions/admin-content-inspection/index.ts supabase/functions/deleted-content-retention-expiry/index.ts supabase/functions/platform-brand-retention-expiry/index.ts supabase/functions/_shared/brand-retention-origin.ts supabase/functions/r2-disposable-qualification/index.ts
          deno test --node-modules-dir=none --no-lock --allow-env supabase/functions/revenuecat-premium-reconcile/authority.test.ts supabase/functions/revenuecat-premium-reconcile/index_test.ts
      - name: Run canonical Live Stage and Watch-Party Edge authority checks
        shell: bash --noprofile --norc -eo pipefail {0}
        run: |
          deno test --node-modules-dir=none --no-lock supabase/functions/_shared/livekit-seat-session-enforcement_test.ts supabase/functions/_shared/watch-party-livekit-authority_test.ts
          deno check --node-modules-dir=none --no-lock supabase/functions/livekit-token/index.ts supabase/functions/livekit-heartbeat-monitor/index.ts
      - name: Typecheck the versioned notification registration Edge endpoint
        run: DENO_NO_PACKAGE_JSON=1 deno check --node-modules-dir=none --no-lock supabase/functions/notification-device-tokens/index.ts
      - name: Typecheck the inactive receipt router and dedicated Test Store Edge boundaries
        run: DENO_NO_PACKAGE_JSON=1 deno check --node-modules-dir=none --no-lock supabase/functions/revenuecat-receipt-router-v1/index.ts supabase/functions/isolated-sandbox-test-store-v1/index.ts supabase/functions/isolated-test-store-revenuecat-webhook-v1/index.ts supabase/functions/isolated-sandbox-test-store-v2/index.ts supabase/functions/isolated-test-store-provisioner-v2/index.ts supabase/functions/isolated-test-store-revenuecat-webhook-v2/index.ts supabase/functions/isolated-test-store-qualification-v1/index.ts supabase/functions/isolated-test-store-capture-v1/index.ts
      - name: Typecheck inactive PaidVideo and protocol 3 Edge boundaries
        run: DENO_NO_PACKAGE_JSON=1 deno check --node-modules-dir=none --no-lock supabase/functions/isolated-paid-video-authoring-v2/index.ts supabase/functions/isolated-paid-video-upload-v2/index.ts supabase/functions/isolated-paid-video-range-v1/index.ts supabase/functions/isolated-paid-video-checkout-v3/index.ts supabase/functions/isolated-sandbox-test-store-v3/index.ts supabase/functions/isolated-test-store-provisioner-v3/index.ts supabase/functions/isolated-test-store-revenuecat-webhook-v3/index.ts
      - name: Qualify exact normal native-store endpoint runtime on loopback only
        env:
          DENO_DIR: ${{ runner.temp }}/native-store-edge-deno-cache
        run: |
          npm ci --ignore-scripts --no-audit --no-fund --prefix isolated-runtime/native-store-edge-tool
          native_deno="$GITHUB_WORKSPACE/isolated-runtime/native-store-edge-tool/node_modules/@deno/linux-x64-glibc/deno"
          "$native_deno" cache --config supabase/functions/native-store-sandbox-command-v1/deno.json --frozen supabase/functions/native-store-sandbox-command-v1/index.ts
          node isolated-runtime/native-store-sandbox-v1/edge-runtime.mjs --deno "$native_deno"
      - name: Qualify pinned normal Studio authoring and upload endpoints on loopback only
        env:
          DENO_DIR: ${{ runner.temp }}/native-store-edge-deno-cache
        run: |
          native_deno="$GITHUB_WORKSPACE/isolated-runtime/native-store-edge-tool/node_modules/@deno/linux-x64-glibc/deno"
          "$native_deno" cache --config supabase/functions/isolated-paid-video-authoring-v2/deno.json --frozen supabase/functions/isolated-paid-video-authoring-v2/index.ts
          "$native_deno" cache --config supabase/functions/isolated-paid-video-upload-v2/deno.json --frozen supabase/functions/isolated-paid-video-upload-v2/index.ts
          node isolated-runtime/native-paid-video-authoring-v1/edge-runtime.mjs --deno "$native_deno"
          "$native_deno" test --config supabase/functions/isolated-paid-video-authoring-v2/deno.json --cached-only supabase/functions/_shared/isolated-paid-video-r2_test.ts
      - name: Verify pinned native private-range endpoint and playback boundary
        run: |
          native_deno="$GITHUB_WORKSPACE/isolated-runtime/native-store-edge-tool/node_modules/@deno/linux-x64-glibc/deno"
          "$native_deno" cache --config supabase/functions/native-store-paid-video-range-v1/deno.json --frozen supabase/functions/native-store-paid-video-range-v1/index.ts
          node isolated-runtime/native-store-sandbox-v1/range-edge-runtime.mjs --deno "$native_deno"
          node --test ops/isolated-paid-video-worker/native-range.test.mjs tests/creator-money/native-store-private-range.test.mjs tests/creator-money/native-store-range-profile.test.mjs tests/native-store-paid-video-playback.test.mjs
      - name: Verify typed R2 runtime and actual local workerd limits without provider access
        run: |
          node --test ops/isolated-paid-video-worker/r2-runtime.test.mjs ops/native-paid-video-scanner-runtime/runtime.test.mjs ops/native-paid-video-scanner-runtime/definition-snapshots.test.mjs ops/native-paid-video-scanner-runtime/state-lock.test.mjs
          npm ci --ignore-scripts --no-audit --no-fund --prefix isolated-runtime/native-paid-video-r2-worker
          npm run verify --prefix isolated-runtime/native-paid-video-r2-worker
          npm run verify:maximum --prefix isolated-runtime/native-paid-video-r2-worker
      - name: Qualify default-off native ingress and reconciliation runtimes on loopback only
        env:
          DENO_DIR: ${{ runner.temp }}/native-store-edge-deno-cache
        run: |
          native_deno="$GITHUB_WORKSPACE/isolated-runtime/native-store-edge-tool/node_modules/@deno/linux-x64-glibc/deno"
          "$native_deno" cache --config supabase/functions/native-store-ingress-v1/deno.json --frozen supabase/functions/native-store-ingress-v1/index.ts
          "$native_deno" cache --config supabase/functions/native-store-reconcile-v1/deno.json --frozen supabase/functions/native-store-reconcile-v1/index.ts
          node isolated-runtime/native-store-sandbox-v1/worker-edge-runtime.mjs --deno "$native_deno"
      - name: Typecheck creator commerce and reporting Edge boundaries
        run: DENO_NO_PACKAGE_JSON=1 deno check --node-modules-dir=none --no-lock supabase/functions/create-creator-tip-checkout/index.ts supabase/functions/stripe-tip-webhook/index.ts supabase/functions/stripe-event-auction-checkout/index.ts supabase/functions/stripe-event-auction-webhook/index.ts supabase/functions/stripe-room-auction-checkout/index.ts supabase/functions/stripe-room-auction-webhook/index.ts supabase/functions/google-play-external-reporter/index.ts supabase/functions/stripe-merch-checkout/index.ts supabase/functions/stripe-merch-webhook/index.ts supabase/functions/stripe-merch-cost-reconcile/index.ts supabase/functions/merch-tracking-webhook/index.ts supabase/functions/merch-tracking-reconcile/index.ts supabase/functions/creator-event-broadcast/index.ts supabase/functions/stripe-auction-cost-reconcile/index.ts supabase/functions/stripe-auction-test-transfer/index.ts supabase/functions/merch-reconciliation-driver/index.ts supabase/functions/auction-observation-driver/index.ts supabase/functions/auction-approved-automation/index.ts supabase/functions/stripe-fee-report-import/index.ts supabase/functions/stripe-paid-video-checkout/index.ts supabase/functions/stripe-paid-video-webhook/index.ts supabase/functions/stripe-sandbox-paid-video-playback/index.ts supabase/functions/stripe-video-cost-reconcile/index.ts
      - name: Run exact role and explicit permission checks
        run: deno test --node-modules-dir=none --no-lock supabase/functions/_shared/exact-subject-authority_test.ts supabase/functions/_shared/platform-role-authority_test.ts
      - name: Typecheck cashout and pending provider reconciliation entry points
        run: DENO_NO_PACKAGE_JSON=1 deno check --node-modules-dir=none --no-lock supabase/functions/sandbox-creator-cashout/index.ts supabase/functions/sandbox-creator-cashout-webhook/index.ts supabase/functions/creator-cashout-driver/index.ts supabase/functions/creator-cashout-worker/index.ts supabase/functions/creator-cashout-webhook/index.ts supabase/functions/creator-cashout-fee-import/index.ts supabase/functions/revenuecat-pending-reconcile/index.ts supabase/functions/stripe-connect-live-observation-webhook/index.ts
      - name: Typecheck dormant creator provider observer
        run: DENO_NO_PACKAGE_JSON=1 deno check --node-modules-dir=none --no-lock supabase/functions/creator-provider-observation-worker/index.ts
      - name: Typecheck authenticated creator setup and owner tax catalog boundaries
        run: DENO_NO_PACKAGE_JSON=1 deno check --node-modules-dir=none --no-lock supabase/functions/stripe-connect-account/index.ts supabase/functions/stripe-connect-onboarding-link/index.ts supabase/functions/stripe-connect-account-sync/index.ts supabase/functions/stripe-tax-category-catalog/index.ts

  database:
    name: Validation / Database
    if: needs.plan.outputs.database == 'true'
    needs: plan
    runs-on: ubuntu-latest
    # Expanded native proofs project 53m13s including the measured successful tail.
    # 20% engineering allowance, rounded up: 65m. See docs/DATABASE_VALIDATION_BUDGET.md.
    # Aggregate budget only; every script/SQL/lock deadline remains unchanged.
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: supabase/setup-cli@afb1b15109756ea5cf9d8985a359d9095235ca2b # v2.1.2
        with: { version: 2.109.1 }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - name: Rebuild and test the local database
        run: |
          npm ci --prefix tests/integration/real-peer-browser --ignore-scripts
          node tests/integration/real-peer-browser/node_modules/playwright/cli.js install --with-deps chromium --only-shell
          supabase start
          node --test tests/local-ci-cron-isolation.test.mjs
          supabase db reset --help
          supabase migration up --help
          supabase db reset --local --version 20261031204321
          node --test tests/chat-activity-upgrade-runner-source.test.mjs
          SUPABASE_DB_CONTAINER=supabase_db_chillywood-mobile node scripts/test-chat-activity-upgrade-postgres.mjs
          # Preserve historical Stripe admission/gate races on a genuine schema
          # boundary. Never disable current admission triggers to seed old tips.
          # This is one additional local DB reset, not a second Product suite.
          supabase db reset --local --version 20261112041003
          node scripts/with-local-ci-cron-paused.mjs <<'HISTORICAL_TIP_PROOFS'
          TIP_SCHEMA_EXPECTATION=historical SUPABASE_DB_CONTAINER=supabase_db_chillywood-mobile node scripts/test-tip-cross-rail-concurrency-postgres.mjs
          HISTORICAL_TIP_PROOFS
          supabase migration up --local
          # Pause after CLI resets/rebuilds, which may replace server configuration.
          # Keep every cron row and source fingerprint intact during native proofs.
          node scripts/with-local-ci-cron-paused.mjs <<'NATIVE_PROOFS'
          supabase test db
          node --test tests/discovery-realtime-native-source.test.mjs
          node --experimental-websocket scripts/test-discovery-realtime-delivery.mjs
          node --test tests/live-room-native-runner-source.test.mjs
          SUPABASE_DB_CONTAINER=supabase_db_chillywood-mobile node scripts/test-live-room-host-settings-concurrency.mjs
          SUPABASE_DB_CONTAINER=supabase_db_chillywood-mobile node scripts/test-room-live-start-dedup-concurrency.mjs
          node --test tests/auction-transfer-native-runner-source.test.mjs
          SUPABASE_DB_CONTAINER=supabase_db_chillywood-mobile node scripts/test-subscription-bindings-native-postgres.mjs
          SUPABASE_DB_CONTAINER=supabase_db_chillywood-mobile node scripts/test-event-auction-concurrency-postgres.mjs
          SUPABASE_DB_CONTAINER=supabase_db_chillywood-mobile node scripts/test-google-external-reporting-concurrency-postgres.mjs
          SUPABASE_DB_CONTAINER=supabase_db_chillywood-mobile node scripts/test-room-seat-auction-concurrency-postgres.mjs
          SUPABASE_DB_CONTAINER=supabase_db_chillywood-mobile node scripts/test-paid-party-capacity-concurrency-postgres.mjs
          SUPABASE_DB_CONTAINER=supabase_db_chillywood-mobile node scripts/test-auction-transfer-concurrency-postgres.mjs
          TIP_SCHEMA_EXPECTATION=current SUPABASE_DB_CONTAINER=supabase_db_chillywood-mobile node scripts/test-tip-cross-rail-concurrency-postgres.mjs
          SUPABASE_DB_CONTAINER=supabase_db_chillywood-mobile node scripts/test-merch-tracking-concurrency-postgres.mjs
          SUPABASE_DB_CONTAINER=supabase_db_chillywood-mobile node scripts/test-merch-return-cases-concurrency-postgres.mjs
          SUPABASE_DB_CONTAINER=supabase_db_chillywood-mobile node scripts/test-cashout-execution-concurrency-postgres.mjs
          SUPABASE_DB_CONTAINER=supabase_db_chillywood-mobile node scripts/test-sandbox-cashout-concurrency-postgres.mjs
          SUPABASE_DB_CONTAINER=supabase_db_chillywood-mobile node scripts/test-sandbox-payout-notification-exact-deploy-postgres.mjs
          SUPABASE_DB_CONTAINER=supabase_db_chillywood-mobile node scripts/test-social-engagement-exact-deploy-postgres.mjs
          node ops/automatic-commerce-cutover/run-native.mjs --docker supabase_db_chillywood-mobile
          SUPABASE_DB_CONTAINER=supabase_db_chillywood-mobile node scripts/test-commerce-fee-concurrency-postgres.mjs
          SUPABASE_DB_CONTAINER=supabase_db_chillywood-mobile node scripts/test-clip-export-concurrency-postgres.mjs
          node --test tests/clip-export-pool-native-runner-source.test.mjs
          SUPABASE_DB_CONTAINER=supabase_db_chillywood-mobile node scripts/test-clip-export-pool-concurrency-postgres.mjs
          SUPABASE_DB_CONTAINER=supabase_db_chillywood-mobile node scripts/test-connect-dual-mode-concurrency-postgres.mjs
          SUPABASE_DB_CONTAINER=supabase_db_chillywood-mobile node scripts/test-chat-call-retry-concurrency-postgres.mjs
          SUPABASE_DB_CONTAINER=supabase_db_chillywood-mobile node scripts/test-profile-engagement-concurrency.mjs
          SUPABASE_DB_CONTAINER=supabase_db_chillywood-mobile node scripts/test-creator-video-engagement-concurrency.mjs
          node scripts/test-content-inspection-postgres.mjs
          node scripts/test-deleted-content-retention-postgres.mjs
          node scripts/test-deleted-media-retirement-postgres.mjs
          node scripts/test-platform-brand-retention-postgres.mjs
          node --test tests/brand-global-retention.test.mjs tests/brand-retention-worker.test.mjs
          node --test tests/archived-brand-verification.test.mjs tests/archived-brand-worker.test.mjs
          docker build --tag chillywood-archived-scanner-test --file ops/malware-scanner-worker/Dockerfile ops/malware-scanner-worker
          docker run --rm --network none --entrypoint node --volume "$PWD:/workspace:ro" --workdir /workspace chillywood-archived-scanner-test scripts/test-archived-brand-worker-clamav.mjs
          node --test supabase/functions/_shared/r2-disposable-qualification.test.mjs supabase/functions/_shared/r2-disposable-qualification-store.test.mjs
          node --test supabase/functions/_shared/r2-disposable-qualification-fence.test.mjs
          node scripts/test-r2-qualification-ledger-postgres.mjs
          node --test tests/brand-soft-removal-scan-queue.test.mjs tests/brand-review-retention-evidence.test.mjs tests/brand-permission-reduction-fence.test.mjs tests/brand-reference-free-profile.test.mjs
          node scripts/test-platform-brand-expiry-transport-postgres.mjs
