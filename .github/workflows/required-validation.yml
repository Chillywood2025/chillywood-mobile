  database-isolated-sandbox-native:
    name: Validation / Isolated Sandbox Native PostgreSQL 17.6
    if: needs.plan.outputs.database == 'true'
    needs: plan
    runs-on: ubuntu-24.04
    # Includes signed scanner prerequisites and the distinct retained Auth/HTTP
    # successor. Every stage remains mandatory and owns bounded local cleanup.
    timeout-minutes: 60
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - name: Build verified official PostgreSQL 17.6 for disposable fixtures
        shell: bash --noprofile --norc -eo pipefail {0}
        run: |
          pg_build="$RUNNER_TEMP/isolated-sandbox-pg17"
          mkdir "$pg_build"
          curl --fail --location --proto '=https' --tlsv1.2 --max-time 180 \
            --output "$pg_build/postgresql-17.6.tar.bz2" \
            https://ftp.postgresql.org/pub/source/v17.6/postgresql-17.6.tar.bz2
          echo "e0630a3600aea27511715563259ec2111cd5f4353a4b040e0be827f94cd7a8b0  $pg_build/postgresql-17.6.tar.bz2" | sha256sum --check --strict
          tar --extract --bzip2 --file "$pg_build/postgresql-17.6.tar.bz2" --directory "$pg_build"
          cd "$pg_build/postgresql-17.6"
          ./configure --prefix="$pg_build/install" --without-icu --without-readline --without-zlib --with-ssl=openssl
          make --jobs=2
          make install
          # The actual legacy migration replay requires both official contrib
          # extensions. Core make/install does not install contrib modules.
          make --directory=contrib/pgcrypto --jobs=2
          make --directory=contrib/pgcrypto install
          make --directory=contrib/pg_trgm --jobs=2
          make --directory=contrib/pg_trgm install
      - name: Run all isolated native suites and their actual-response client bridge
        run: node scripts/ci/isolated-sandbox-native.mjs --local-bin "$RUNNER_TEMP/isolated-sandbox-pg17/install/bin" --output-dir "$GITHUB_WORKSPACE/isolated-sandbox-native-evidence"
      - name: Verify native store sandbox durable receipt journal
        run: node isolated-runtime/native-store-sandbox-v1/journal.native.mjs --local-bin "$RUNNER_TEMP/isolated-sandbox-pg17/install/bin"
      - name: Verify normal native store quote preparation and recovery
        run: node isolated-runtime/native-store-sandbox-v1/quote.native.mjs --local-bin "$RUNNER_TEMP/isolated-sandbox-pg17/install/bin"
      - name: Verify normal paid video authoring, immutable publication and recovery
        run: node isolated-runtime/native-paid-video-authoring-v1/authoring.native.mjs --local-bin "$RUNNER_TEMP/isolated-sandbox-pg17/install/bin"
      - name: Verify bounded Studio installation, private readback and actual operations path
        run: |
          node --test isolated-runtime/native-paid-video-authoring-v1/deployment.test.mjs
          node isolated-runtime/native-paid-video-authoring-v1/deployment.native-cases.mjs --local-bin "$RUNNER_TEMP/isolated-sandbox-pg17/install/bin" --combined-runtime
      - name: Verify Studio forward installation against the complete legacy catalog
        run: node isolated-runtime/native-paid-video-authoring-v1/deployment.native-cases.mjs --local-bin "$RUNNER_TEMP/isolated-sandbox-pg17/install/bin" --full
      - name: Verify typed R2 upload, native settlement and existing S3 Test Store authority
        run: node isolated-runtime/native-paid-video-r2-v1/r2.native.mjs --local-bin "$RUNNER_TEMP/isolated-sandbox-pg17/install/bin"
      - name: Verify bounded R2 installation and private readback
        run: |
          node --test isolated-runtime/native-paid-video-r2-v1/deployment.test.mjs
          node isolated-runtime/native-paid-video-r2-v1/deployment.native-cases.mjs --local-bin "$RUNNER_TEMP/isolated-sandbox-pg17/install/bin"
      - name: Verify R2 forward installation against the complete legacy catalog
        run: node isolated-runtime/native-paid-video-r2-v1/deployment.native-cases.mjs --local-bin "$RUNNER_TEMP/isolated-sandbox-pg17/install/bin" --full
      - name: Verify bounded native quote startup diagnostics and isolated cleanup
        run: node isolated-runtime/native-store-sandbox-v1/quote-startup.native.mjs --local-bin "$RUNNER_TEMP/isolated-sandbox-pg17/install/bin"
      - name: Verify native store default-off managed installation closure
        run: node isolated-runtime/native-store-sandbox-v1/install-managed.native.mjs --local-bin "$RUNNER_TEMP/isolated-sandbox-pg17/install/bin" --event-trigger-parity
      - name: Verify native install delta with independent catalog OID allocation
        run: node isolated-runtime/native-store-sandbox-v1/install-managed.native.mjs --local-bin "$RUNNER_TEMP/isolated-sandbox-pg17/install/bin" --event-trigger-parity --oid-padding
      - name: Verify offline native install transaction envelope and uncertain outcome classification
        run: node isolated-runtime/native-store-sandbox-v1/install-managed.native.mjs --local-bin "$RUNNER_TEMP/isolated-sandbox-pg17/install/bin" --event-trigger-parity --envelope-proof
      - name: Verify compact native recovery with exact readonly identity and fail-closed mutations
        run: node isolated-runtime/native-store-sandbox-v1/install-managed.native.mjs --local-bin "$RUNNER_TEMP/isolated-sandbox-pg17/install/bin" --event-trigger-parity --oid-padding --recovery-proof
      - name: Verify bounded private native post-install readback candidate
        run: |
          node --test tests/creator-money/native-store-private-state-readback.test.mjs
          node isolated-runtime/native-store-sandbox-v1/install-managed.native.mjs --local-bin "$RUNNER_TEMP/isolated-sandbox-pg17/install/bin" --private-state-proof
      - name: Verify native store quote and claim runtime under managed installation owners
        run: node isolated-runtime/native-store-sandbox-v1/quote.native.mjs --local-bin "$RUNNER_TEMP/isolated-sandbox-pg17/install/bin" --managed-install
      - name: Verify native shared-SKU server reservation without purchase dispatch
        run: node isolated-runtime/native-store-sandbox-v1/quote.native.mjs --local-bin "$RUNNER_TEMP/isolated-sandbox-pg17/install/bin" --managed-install --reservation-proof
      - name: Verify dormant one-shot native attempt consumption and crash recovery
        run: node isolated-runtime/native-store-sandbox-v1/quote.native.mjs --local-bin "$RUNNER_TEMP/isolated-sandbox-pg17/install/bin" --managed-install --dispatch-proof
      - name: Qualify native pending receipt delivery fences on actual managed source
        run: node isolated-runtime/native-store-sandbox-v1/quote.native.mjs --local-bin "$RUNNER_TEMP/isolated-sandbox-pg17/install/bin" --managed-install --pending-fence-proof
      - name: Qualify dormant native dispatch against actual managed source
        run: node isolated-runtime/native-store-sandbox-v1/quote.native.mjs --local-bin "$RUNNER_TEMP/isolated-sandbox-pg17/install/bin" --managed-install --qualified-dispatch-proof
      - name: Qualify private native effects, terminal slots and authenticated replay on actual managed source
        run: node isolated-runtime/native-store-sandbox-v1/quote.native.mjs --local-bin "$RUNNER_TEMP/isolated-sandbox-pg17/install/bin" --managed-install --qualified-dispatch-proof --effects-proof
      - name: Verify default-off Android Play handoff, settlement and protected playback admission
        run: node isolated-runtime/native-store-play-handoff-v1/handoff.native.mjs --local-bin "$RUNNER_TEMP/isolated-sandbox-pg17/install/bin" --settlement-proof
      - name: Verify prerequisite and caller-owned image identity controls
        run: |
          python3 scripts/ci/paid-video-prerequisites/provision_test.py
          python3 isolated-runtime/sandbox-commerce-v1/tests/local-auth-paid-video-retained-platform-v2/image_chain_test.py
          python3 isolated-runtime/sandbox-commerce-v1/tests/local-auth-paid-video-retained-platform-v2/harness/raw_put_test.py
      - name: Provision verified public prerequisites for disposable PaidVideo qualification
        run: python3 scripts/ci/paid-video-prerequisites/provision.py --repo "$GITHUB_WORKSPACE" --output "$RUNNER_TEMP/paid-video-prerequisites"
      - name: Run actual PaidVideo PostgreSQL, scanner, Auth, HTTP and app bridges
        run: |
          node --test tests/test-store-v3-provider-fixture-yield.test.mjs
          node scripts/ci/paid-video-validation.mjs --local-bin "$RUNNER_TEMP/isolated-sandbox-pg17/install/bin" --output-dir "$RUNNER_TEMP/paid-video-canonical" --database "$RUNNER_TEMP/paid-video-prerequisites/database" --certificates /usr/local/etc/certs --deno "$RUNNER_TEMP/paid-video-prerequisites/deno"
      - name: Preserve bounded PaidVideo qualification reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: paid-video-canonical-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
