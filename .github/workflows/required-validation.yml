            ${{ runner.temp }}/paid-video-prerequisites/prerequisite-proof.json
          if-no-files-found: warn
          retention-days: 14
      - name: Preserve isolated source attempt evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: isolated-sandbox-native-${{ github.run_id }}-${{ github.run_attempt }}
          path: isolated-sandbox-native-evidence
