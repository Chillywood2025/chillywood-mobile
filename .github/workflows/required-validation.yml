  policy:
    name: Validation / Policy
    if: needs.plan.outputs.policy == 'true'
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - name: Validate the replacement workflow and retained release boundaries
        run: node --test tests/ci/*.test.mjs tests/release-review-gate.test.mjs tests/release-control-plane.test.mjs

  result:
    name: Validation / Results
    if: always()
    needs: [plan, core, product, sensitive, database, database-brand-native, database-isolated-sandbox-native, native-inference, native-sdk, native-release, autonomous, policy]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      NEEDS_JSON: ${{ toJson(needs) }}
    steps:
      - name: Publish a complete source-run summary
        run: |
          node - <<'NODE'
          const needs = JSON.parse(process.env.NEEDS_JSON);
          const failures = Object.entries(needs).filter(([, value]) => value.result === 'failure' || value.result === 'cancelled');
          const planFailed = needs.plan?.result !== 'success';
          const coreFailed = needs.core?.result !== 'success';
          const brandNativeFailed = needs.plan?.outputs?.database === 'true'
            && needs['database-brand-native']?.result !== 'success';
          const isolatedSandboxFailed = needs.plan?.outputs?.database === 'true'
            && needs['database-isolated-sandbox-native']?.result !== 'success';
          console.log(JSON.stringify({ jobs: Object.fromEntries(Object.entries(needs).map(([key, value]) => [key, value.result])), failures: failures.map(([key]) => key) }));
          if (planFailed || coreFailed || brandNativeFailed || isolatedSandboxFailed || failures.length > 0) process.exit(1);
          NODE
