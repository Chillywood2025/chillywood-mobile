name: Transient PR 294 current-truth companion

on:
  push:
    branches:
      - chatgpt/assurance-baseline-sync-20260828
    paths:
      - .github/workflows/transient-current-truth-companion-294.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: chatgpt/assurance-baseline-sync-20260828
          fetch-depth: 0
      - name: Bind current truth to repaired protected base and self-remove
        env:
          TARGET_SHA: 753f41d00052b4e3cd291790cc60c3ad44a6786e
          TARGET_TREE: d68b3dea264ae72f941ae5a4dc222af459b19dba
        run: |
          set -euo pipefail
          test "$(git rev-parse origin/main)" = "$TARGET_SHA"
          test "$(git rev-parse "$TARGET_SHA^{tree}")" = "$TARGET_TREE"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path = 'config/assurance/current-truth-v1.json';
          const value = JSON.parse(fs.readFileSync(path, 'utf8'));
          value.mainSha = process.env.TARGET_SHA;
          value.protectedMainAuthority.checkpointSha = process.env.TARGET_SHA;
          value.protectedMainAuthority.checkpointTree = process.env.TARGET_TREE;
          fs.writeFileSync(path, `${JSON.stringify(value)}\n`);
          NODE
          rm .github/workflows/transient-current-truth-companion-294.yml
          git config user.name 'chatgpt-codex-connector[bot]'
          git config user.email 'chatgpt-codex-connector[bot]@users.noreply.github.com'
          git add config/assurance/current-truth-v1.json .github/workflows/transient-current-truth-companion-294.yml
          git diff --cached --exit-code && exit 1 || true
          git commit -m 'fix: bind PR 294 to repaired protected-main truth'
          git push origin HEAD:chatgpt/assurance-baseline-sync-20260828
