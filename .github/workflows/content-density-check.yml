name: Content density check
on:
  push:
    branches: [chatgpt/content-card-rows-home-density-v1]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/content-card-rows-home-density-v1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm ci --prefix ops/alert-automation
      - run: python3 scripts/patch-content-transform.py
      - run: python3 scripts/apply-content-card-density-v1.py
      - name: Align Clip Studio guard with compact Content Library UI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/guard-clip-studio-policy.mjs')
          text = path.read_text()
          old = '  "Add videos in Clip Studio",\n'
          new = '  "Content Library",\n'
          if old not in text:
              raise SystemExit('expected legacy Clip Studio copy guard not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - run: npm run typecheck
      - run: npm run guard:clip-studio-policy
      - run: npm run guard:circle-spectator-policy
      - run: npm run guard:route-contracts
      - run: git diff --check
      - name: Save verified source changes
        run: |
          git config user.name "chatgpt-codex-connector[bot]"
          git config user.email "chatgpt-codex-connector[bot]@users.noreply.github.com"
          git add app/channel-settings.tsx app/channel/'[userId].tsx' 'app/(tabs)/index.tsx' components/creator-media/creator-video-card.tsx scripts/guard-clip-studio-policy.mjs
          git commit -m "Compact content cards and organize creator shelves"
          git push
