name: Content density check
on:
  push:
    branches: [chatgpt/content-card-rows-home-density-v1]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/content-card-rows-home-density-v1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm ci --prefix ops/alert-automation
      - run: python3 scripts/apply-content-card-route-selectors-v1.py
      - run: python3 scripts/apply-vip-video-shelf-v1.py
      - run: npm run typecheck
      - run: node scripts/guard-content-card-density-v1.mjs
      - run: npm run guard:route-contracts
      - run: git diff --check
      - name: Save verified source changes
        run: |
          git config user.name "chatgpt-codex-connector[bot]"
          git config user.email "chatgpt-codex-connector[bot]@users.noreply.github.com"
          git add _lib/creatorVipPasses.ts _lib/creatorVideos.ts app/channel-settings.tsx app/channel/'[userId].tsx components/creator-media/creator-video-card.tsx components/creator-media/CreatorContentActionSheet.tsx supabase/functions/public-creator-video-cards/index.ts supabase/migrations/20260827171500_creator_vip_video_shelf_v1.sql
          git commit -m "Add VIP video shelf and protected playback"
          git push
