name: Foreground navigation preservation repair v2

on:
  push:
    branches:
      - chatgpt/foreground-navigation-preservation-20260829

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/foreground-navigation-preservation-20260829
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply exact lifecycle navigation repair
        run: |
          echo '' | base64 -d > /tmp/repair.py
          python3 /tmp/repair.py
      - name: Install root dependencies
        run: npm ci
      - name: Install alert automation dependencies
        run: npm ci --prefix ops/alert-automation
      - name: Run focused regression tests
        run: node --test tests/navigation-resume-policy.test.mjs tests/foreground-navigation-preservation.test.mjs tests/wave1/legal-requirements-gate-lifecycle.test.mjs
      - name: TypeScript validation
        run: npx tsc --noEmit --pretty false
      - name: Commit validated repair and remove transient workflows
        run: |
          rm .github/workflows/transient-foreground-navigation-preservation.yml
          rm .github/workflows/transient-foreground-navigation-preservation-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/_layout.tsx _lib/session.tsx _lib/runtimeUpdates.tsx tests/foreground-navigation-preservation.test.mjs .github/workflows/transient-foreground-navigation-preservation.yml .github/workflows/transient-foreground-navigation-preservation-v2.yml
          git commit -m "fix: preserve navigation across foreground revalidation"
          git push origin HEAD:chatgpt/foreground-navigation-preservation-20260829
