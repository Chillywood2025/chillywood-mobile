name: Phase 1 CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  autonomous-systems-ios-contract:
    name: Phase 1 / Autonomous Systems iOS Contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate autonomous iOS contracts
        run: |
          npm run guard:autonomous-systems-contract
          npm run proof:autonomous-systems-contract
          npm run guard:autonomous-operating-model
          npm run guard:ios-autonomous-call-retry
          npm run proof:ios-autonomous-call-retry
          npm run guard:ios-notification-autonomy
          npm run proof:ios-notification-autonomy
          npm run test:ios-notification-autonomy
          npm run guard:ios-release-autonomy
          npm run proof:ios-release-autonomy
          npm run test:ios-release-autonomy
          npm run guard:ios-observability-autonomy
          npm run proof:ios-observability-autonomy
          npm run test:ios-observability-autonomy
          npm run guard:ios-installed-qa-autonomy
          npm run proof:ios-installed-qa-autonomy
          npm run test:ios-installed-qa-autonomy
          npm run guard:ios-autonomous-system-coverage
          npm run proof:ios-autonomous-system-coverage

  supabase-database-integration:
    name: Phase 1 / Supabase Database Integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      - name: Verify required database suites are present
        run: test -f supabase/tests/chilly_chat_call_transitions_test.sql && test -f supabase/tests/revenuecat_atomic_transactions_test.sql && test -f supabase/tests/ios_autonomous_systems_test.sql

      - name: Start local Supabase services
        run: supabase start

      - name: Reset local database from migrations
        run: supabase db reset

      - name: Run pgTAP database integration suites
        run: supabase test db

  phase1-check:
    name: Phase 1 / ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - key: lint
            name: Repository Lint
            command: npm run lint
          - key: typescript
            name: TypeScript
            command: npx tsc --noEmit
          - key: runtime
            name: Runtime Validation
            command: npm run validate:runtime
          - key: routes
            name: Route Contracts
            command: npm run guard:route-contracts
          - key: ios
            name: iOS Configuration
            command: npm run guard:ios-config-policy && npm run proof:ios-config && npm run guard:apple-app-site-association && npm run guard:ios-commerce-catalog && npm run guard:ios-commerce-policy && npm run proof:ios-commerce && npm run proof:ios-media-readiness && npm run proof:ios-push-platform && npm run guard:ios-native-call-policy && npm run proof:ios-voip-policy && npm run proof:ios-voip-token-lifecycle && npm run guard:ios-privacy-manifest && npm run guard:ios-release-workflows
          - key: android
            name: Android Regression Guards
            command: npm run guard:payment-rail-policy && npm run guard:notification-room-call-policy && npm run guard:chilly-chat-call-push-policy && npm run guard:watch-party-livekit && npm run guard:old-room-handling
          - key: expo-doctor
            name: Expo Doctor
            command: npx expo-doctor

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install alert-automation dependencies for TypeScript
        if: matrix.key == 'typescript'
        run: npm ci --prefix ops/alert-automation

      - name: Run runtime validation
        if: matrix.key == 'runtime'
        env:
          CI: "1"
          EXPO_NO_DOTENV: "1"
          EXPO_NO_CLIENT_ENV_VARS: "1"
          EXPO_PUBLIC_SUPABASE_URL: "https://ci.invalid"
          EXPO_PUBLIC_SUPABASE_ANON_KEY: "ci-placeholder-not-a-secret"
          EXPO_PUBLIC_BETA_OPERATOR_ALLOWLIST: "ci@example.invalid"
          EXPO_PUBLIC_BETA_ENVIRONMENT: "closed-beta"
        run: npm run validate:runtime

      - name: Run diagnostic
        if: matrix.key != 'runtime'
        run: ${{ matrix.command }}
