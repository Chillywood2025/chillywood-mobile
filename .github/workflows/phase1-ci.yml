name: Phase 1 CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  phase1-check:
    name: Phase 1 / ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - key: lint
            name: Repository Lint
            command: npm run lint
          - key: typescript
            name: TypeScript
            command: npx tsc --noEmit
          - key: runtime
            name: Runtime Validation
            command: npm run validate:runtime
          - key: routes
            name: Route Contracts
            command: npm run guard:route-contracts
          - key: ios
            name: iOS Configuration
            command: npm run guard:ios-config-policy && npm run proof:ios-config && npm run guard:apple-app-site-association && npm run guard:ios-commerce-catalog && npm run guard:ios-commerce-policy && npm run proof:ios-commerce && npm run proof:ios-media-readiness && npm run proof:ios-push-platform && npm run guard:ios-native-call-policy && npm run proof:ios-voip-policy && npm run proof:ios-voip-token-lifecycle && npm run guard:ios-privacy-manifest && npm run guard:ios-release-workflows
          - key: android
            name: Android Regression Guards
            command: npm run guard:payment-rail-policy && npm run guard:notification-room-call-policy && npm run guard:chilly-chat-call-push-policy && npm run guard:watch-party-livekit && npm run guard:old-room-handling
          - key: expo-doctor
            name: Expo Doctor
            command: npx expo-doctor

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install alert-automation dependencies for TypeScript
        if: matrix.key == 'typescript'
        run: npm ci --prefix ops/alert-automation

      - name: Run runtime validation
        if: matrix.key == 'runtime'
        env:
          CI: "1"
          EXPO_NO_DOTENV: "1"
          EXPO_NO_CLIENT_ENV_VARS: "1"
          EXPO_PUBLIC_SUPABASE_URL: "https://ci.invalid"
          EXPO_PUBLIC_SUPABASE_ANON_KEY: "ci-placeholder-not-a-secret"
          EXPO_PUBLIC_BETA_OPERATOR_ALLOWLIST: "ci@example.invalid"
          EXPO_PUBLIC_BETA_ENVIRONMENT: "closed-beta"
        run: npm run validate:runtime

      - name: Run diagnostic
        if: matrix.key != 'runtime'
        run: ${{ matrix.command }}
