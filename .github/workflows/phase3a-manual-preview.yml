name: Phase 3A Manual Android Preview Build

on:
  workflow_dispatch:

permissions:
  checks: read
  contents: read
  issues: read
  pull-requests: read

jobs:
  manual-preview-build:
    if: github.ref == 'refs/heads/main'
    name: Manual Preview Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Deny build while late Codex Review findings are unresolved
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/assurance/late-review-sentinel.mjs --require-github

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run typecheck
        run: npm run typecheck

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@c7b66a9c327a43a8fa7c0158e7f30d6040d2481e # v8
        with:
          eas-version: 21.0.1
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build Android preview
        run: eas build --platform android --profile preview --non-interactive
