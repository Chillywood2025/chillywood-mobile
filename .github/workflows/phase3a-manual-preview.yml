name: Phase 3A Manual Android Preview Build

on:
  workflow_dispatch:

permissions:
  checks: read
  contents: read
  issues: read
  pull-requests: read

jobs:
  manual-preview-build:
    if: github.ref == 'refs/heads/main'
    name: Manual Preview Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Deny build while late Codex Review findings are unresolved
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/release-review-gate.mjs

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run typecheck
        run: npm run typecheck

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@eab7a230208c952974db8c3245cfd78402c7b385 # 9.0.0
        with:
          eas-version: 21.0.1
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build Android preview
        run: eas build --platform android --profile preview --non-interactive
