name: Temporary Chi'lly Chat room-id contract repair

on:
  push:
    branches:
      - chatgpt/chilly-chat-room-id-contract-repair-20260830

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: chatgpt/chilly-chat-room-id-contract-repair-20260830
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply exact bounded repair
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}")
              p.write_text(text.replace(old, new, 1))

          provenance = "_lib/nativeCallTransitionProvenance.mjs"
          replace_once(
              provenance,
              'const CLAIM_ID_PATTERN = /^[0-9a-f]{64}$/u;\n',
              'const CLAIM_ID_PATTERN = /^[0-9a-f]{64}$/u;\nconst COMMUNICATION_ROOM_ID_PATTERN = /^[a-z0-9_-]{1,128}$/u;\n',
          )
          replace_once(
              provenance,
              'const normalizeUuid = (value) => {\n  const normalized = normalizeText(value);\n  return UUID_PATTERN.test(normalized) ? normalized : "";\n};\n',
              'const normalizeUuid = (value) => {\n  const normalized = normalizeText(value);\n  return UUID_PATTERN.test(normalized) ? normalized : "";\n};\nconst normalizeCommunicationRoomId = (value) => {\n  const normalized = normalizeText(value);\n  return COMMUNICATION_ROOM_ID_PATTERN.test(normalized) ? normalized : "";\n};\n',
          )
          replace_once(
              provenance,
              '      const roomId = normalizeUuid(input?.roomId);\n',
              '      const roomId = normalizeCommunicationRoomId(input?.roomId);\n',
          )

          policy = "_lib/communicationCallMediaPolicy.mjs"
          replace_once(
              policy,
              'const CALL_ID_PATTERN = /^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/iu;\n',
              'const CALL_ID_PATTERN = /^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/iu;\nconst COMMUNICATION_ROOM_ID_PATTERN = /^[a-z0-9_-]{1,128}$/u;\n',
          )
          replace_once(
              policy,
              '    || iosAcceptedMediaClaimStates.get(claim) !== "completing" || !ids.every((id) => CALL_ID_PATTERN.test(id)) || !IOS_CALL_MEDIA_PROVIDERS.has(mediaProvider)\n',
              '    || iosAcceptedMediaClaimStates.get(claim) !== "completing"\n    || ![ids[0], ids[1], ids[2], ids[4]].every((id) => CALL_ID_PATTERN.test(id))\n    || !COMMUNICATION_ROOM_ID_PATTERN.test(ids[3])\n    || !IOS_CALL_MEDIA_PROVIDERS.has(mediaProvider)\n',
          )
          replace_once(
              policy,
              '  if (![expected.authenticatedUserId, expected.callUuid, expected.inviteId, expected.roomId, expected.threadId].every((id) => CALL_ID_PATTERN.test(id))\n    || !trusted || !IOS_CALL_MEDIA_PROVIDERS.has(expected.mediaProvider) || !exactIosAcceptedInvite(input?.invite, expected)\n',
              '  if (![expected.authenticatedUserId, expected.callUuid, expected.inviteId, expected.threadId].every((id) => CALL_ID_PATTERN.test(id))\n    || !COMMUNICATION_ROOM_ID_PATTERN.test(expected.roomId)\n    || !trusted || !IOS_CALL_MEDIA_PROVIDERS.has(expected.mediaProvider) || !exactIosAcceptedInvite(input?.invite, expected)\n',
          )

          test = Path("tests/chilly-chat-call-room-id-contract.test.mjs")
          test.write_text(r'''import assert from "node:assert/strict";
import { webcrypto } from "node:crypto";
import test from "node:test";

import {
  consumeMountedIosNativeCallRoute,
  createForegroundAuthenticatedUiCallIntentRegistry,
  createIosCallKitAnswerRouteHandler,
} from "../_lib/nativeCallTransitionProvenance.mjs";
import { completeIosAcceptedNativeAnswer } from "../_lib/communicationCallMediaPolicy.mjs";

if (!globalThis.crypto) globalThis.crypto = webcrypto;

const userId = "11111111-1111-4111-8111-111111111111";
const otherUserId = "22222222-2222-4222-8222-222222222222";
const threadId = "33333333-3333-4333-8333-333333333333";
const inviteId = "44444444-4444-4444-8444-444444444444";
const callUuid = "55555555-5555-4555-8555-555555555555";
const roomId = "9CAYUZ";

test("foreground accepted-call handoff accepts canonical communication room codes", () => {
  let now = 1000;
  const registry = createForegroundAuthenticatedUiCallIntentRegistry({
    claimIdFactory: () => "a".repeat(64),
    now: () => now,
  });
  const created = registry.create({
    action: "open_call",
    authenticated: true,
    authenticatedUserId: userId,
    inviteId,
    roomId,
    threadId,
  });
  assert.equal(created.status, "created");
  assert.equal(created.roomId, roomId.toLowerCase());
  const consumed = registry.consume({
    authenticatedUserId: userId,
    claimId: created.claimId,
    threadId,
  });
  assert.equal(consumed?.roomId, roomId.toLowerCase());
  now += 1;

  const denied = createForegroundAuthenticatedUiCallIntentRegistry({
    claimIdFactory: () => "b".repeat(64),
    now: () => now,
  }).create({
    action: "open_call",
    authenticated: true,
    authenticatedUserId: userId,
    inviteId,
    roomId: "../unsafe",
    threadId,
  });
  assert.equal(denied.status, "denied");
});

test("iOS accepted-call media descriptor accepts the same canonical room-code identity", async () => {
  let destination = "";
  const handler = createIosCallKitAnswerRouteHandler({
    completeAnswerFailure: async () => undefined,
    getAuthenticatedUserId: () => userId,
    isActive: () => true,
    replace: (value) => { destination = String(value); },
  });
  const routed = await handler({
    callInviteId: inviteId,
    callType: "video",
    callUuid,
    nativeEventGeneration: 1,
    platform: "ios",
    threadId,
    type: "answerrequested",
  });
  assert.equal(routed, "routed");
  const parsed = new URL(destination, "https://chillywood.invalid");
  const claimId = parsed.searchParams.get("nativeCallClaim");
  assert.ok(claimId);
  const claim = consumeMountedIosNativeCallRoute({
    action: "answer",
    authenticatedUserId: userId,
    authLoading: false,
    callUuid,
    claimId,
    inviteId,
    isSignedIn: true,
    platform: "ios",
    threadId,
  });
  assert.ok(claim);

  const invite = {
    acceptedAt: new Date().toISOString(),
    callType: "video",
    calleeUserId: userId,
    callerUserId: otherUserId,
    communicationRoomId: roomId,
    id: inviteId,
    mediaProvider: "legacy_webrtc",
    status: "accepted",
    threadId,
  };
  const result = await completeIosAcceptedNativeAnswer({
    callUuid,
    invite,
    serverAccepted: true,
    threadId,
    trustedNativeClaim: claim,
  }, {
    completeNative: async () => true,
    monotonicNow: () => globalThis.performance.now(),
    terminal: {
      delay: async () => undefined,
      endNative: async () => true,
      readInvite: async () => invite,
      updateInvite: async () => invite,
    },
  });
  assert.equal(result.status, "ready");
  assert.equal(result.descriptor?.roomId, roomId.toLowerCase());
});
''')

          Path(".github/workflows/_temp_chilly_chat_room_id_contract_repair.yml").unlink()
          PY
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Run focused call handoff regressions
        run: |
          node --test tests/chilly-chat-call-room-id-contract.test.mjs
          node scripts/test-chilly-chat-native-call-action-handoff.mjs
          npx tsc --noEmit
      - name: Commit exact repair and self-delete helper
        shell: bash
        run: |
          git config user.name "Chillywood2025"
          git config user.email "rob2008gn@gmail.com"
          git add _lib/nativeCallTransitionProvenance.mjs _lib/communicationCallMediaPolicy.mjs tests/chilly-chat-call-room-id-contract.test.mjs .github/workflows/_temp_chilly_chat_room_id_contract_repair.yml
          git diff --cached --check
          git commit -m "Accept canonical Chi'lly Chat room IDs in call handoff"
          git push origin HEAD:chatgpt/chilly-chat-room-id-contract-repair-20260830
