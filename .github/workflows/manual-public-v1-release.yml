name: Manual Public V1 Android Release

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: read

jobs:
  public-v1-android-build:
    if: github.ref == 'refs/heads/main'
    name: Public V1 Android Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Deny release while late Codex Review findings are unresolved
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/assurance/late-review-sentinel.mjs --require-github

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Validate runtime config
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_BETA_OPERATOR_ALLOWLIST: ${{ secrets.EXPO_PUBLIC_BETA_OPERATOR_ALLOWLIST }}
          EXPO_PUBLIC_BETA_ENVIRONMENT: public-v1
        run: npm run validate:runtime

      - name: Run lint
        run: npm run lint

      - name: Run typecheck
        run: npm run typecheck

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@c7b66a9c327a43a8fa7c0158e7f30d6040d2481e # v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build Android production bundle
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_BETA_OPERATOR_ALLOWLIST: ${{ secrets.EXPO_PUBLIC_BETA_OPERATOR_ALLOWLIST }}
          EXPO_PUBLIC_BETA_ENVIRONMENT: public-v1
        run: eas build --platform android --profile production --non-interactive
