name: Manual Public V1 Android Release

on:
  workflow_dispatch:

permissions:
  checks: read
  contents: read
  issues: read
  pull-requests: read

jobs:
  public-v1-android-build:
    if: github.ref == 'refs/heads/main'
    name: Public V1 Android Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Deny release while late Codex Review findings are unresolved
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/release-review-gate.mjs

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Validate runtime config
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_BETA_OPERATOR_ALLOWLIST: ${{ secrets.EXPO_PUBLIC_BETA_OPERATOR_ALLOWLIST }}
          EXPO_PUBLIC_BETA_ENVIRONMENT: public-v1
        run: npm run validate:runtime

      - name: Run lint
        run: npm run lint

      - name: Run typecheck
        run: npm run typecheck

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@eab7a230208c952974db8c3245cfd78402c7b385 # 9.0.0
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build Android production bundle
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_BETA_OPERATOR_ALLOWLIST: ${{ secrets.EXPO_PUBLIC_BETA_OPERATOR_ALLOWLIST }}
          EXPO_PUBLIC_BETA_ENVIRONMENT: public-v1
        run: eas build --platform android --profile production --non-interactive
