name: ChatGPT Platform Studio polish
on:
  push:
    branches:
      - chatgpt/platform-studio-polish-20260828
permissions:
  contents: write
jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply bounded Studio polish
        run: python3 scripts/chatgpt-platform-studio-polish.py
      - name: Install dependencies
        run: |
          npm ci --ignore-scripts
          npm ci --prefix ops/alert-automation --ignore-scripts
      - name: Validate focused source
        run: |
          npm run typecheck --if-present
          npm run lint --if-present
          git diff --check
      - name: Commit source and self-clean
        run: |
          rm scripts/chatgpt-platform-studio-polish.py .github/workflows/chatgpt-platform-studio-polish.yml
          git config user.name "Chillywood2025"
          git config user.email "rob2008gn@gmail.com"
          git add app/channel-settings.tsx scripts/chatgpt-platform-studio-polish.py .github/workflows/chatgpt-platform-studio-polish.yml
          git commit -m "Polish Platform Studio operational tabs"
          git push origin HEAD:chatgpt/platform-studio-polish-20260828
