name: Transient diagnose PR294 verifier closure

on:
  push:
    branches:
      - chatgpt/assurance-baseline-sync-20260828
    paths:
      - .github/workflows/transient-fix-pr294-direct-verifier.yml

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/assurance-baseline-sync-20260828
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Print exact verification dependency closure
        run: |
          node --input-type=module - <<'NODE'
          import { deriveVerificationDependencyClosure } from './scripts/assurance/engineering-closure.mjs';
          const closure = deriveVerificationDependencyClosure();
          console.log(JSON.stringify(closure, null, 2));
          NODE
