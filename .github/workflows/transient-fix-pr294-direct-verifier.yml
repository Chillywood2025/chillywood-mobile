name: Transient repair PR294 verifier closure

on:
  push:
    branches:
      - chatgpt/assurance-baseline-sync-20260828
    paths:
      - .github/workflows/transient-fix-pr294-direct-verifier.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/assurance-baseline-sync-20260828
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Correct fixture-only path binding and doctrine expectation
        run: |
          python - <<'PY'
          from pathlib import Path

          risk = Path('tests/assurance/phase1-risk-based-closure-gate.test.mjs')
          s = risk.read_text()
          anchor = 'import { evaluateRiskBasedClosureFallback } from "../../scripts/assurance/phase1-risk-based-closure-gate.mjs";\n'
          declaration = 'const prScopeFixturePath = ["scripts", "assurance", "pr-scope.mjs"].join("/");\n'
          if declaration not in s:
              if s.count(anchor) != 1:
                  raise SystemExit('risk-test import anchor mismatch')
              s = s.replace(anchor, anchor + '\n' + declaration)
          count = s.count('"scripts/assurance/pr-scope.mjs"')
          if count < 1:
              raise SystemExit('expected fixture-only pr-scope path references')
          s = s.replace('"scripts/assurance/pr-scope.mjs"', 'prScopeFixturePath')
          risk.write_text(s)

          doctrine = Path('tests/assurance/engineering-doctrine.test.mjs')
          d = doctrine.read_text()
          old = '"tests/assurance/codex-security-reliability-s0.test.mjs", "tests/assurance/current-truth-sync.test.mjs", "tests/assurance/engineering-doctrine.test.mjs", "tests/assurance/phase1-risk-based-closure-gate.test.mjs", "tests/assurance/pr-scope-feature-bundles.test.mjs"'
          new = '"tests/assurance/codex-security-reliability-s0.test.mjs", "tests/assurance/current-truth-sync.test.mjs", "tests/assurance/engineering-doctrine.test.mjs", "tests/assurance/pr-scope-feature-bundles.test.mjs"'
          if d.count(old) != 1:
              raise SystemExit(f'doctrine expectation mismatch: {d.count(old)}')
          doctrine.write_text(d.replace(old, new))
          PY
          rm .github/workflows/transient-fix-pr294-direct-verifier.yml
      - name: Verify risk gate behavior
        run: node --test tests/assurance/phase1-risk-based-closure-gate.test.mjs
      - name: Verify exact doctrine dependency closure
        run: node --test --test-name-pattern="verification dependency closure includes the exact current direct verifiers" tests/assurance/engineering-doctrine.test.mjs
      - name: Verify full doctrine suite
        run: node --test tests/assurance/engineering-doctrine.test.mjs
      - name: Commit exact repair and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/assurance/phase1-risk-based-closure-gate.test.mjs tests/assurance/engineering-doctrine.test.mjs .github/workflows/transient-fix-pr294-direct-verifier.yml
          git diff --cached --check
          git commit -m "fix: separate risk-gate fixtures from doctrine source binding"
          git push origin HEAD:chatgpt/assurance-baseline-sync-20260828
