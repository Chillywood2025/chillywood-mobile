name: Transient diagnose PR294 current truth

on:
  push:
    branches:
      - chatgpt/assurance-baseline-sync-20260828
    paths:
      - .github/workflows/transient-fix-pr294-direct-verifier.yml

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/assurance-baseline-sync-20260828
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Reproduce repaired working tree and print failing assertion
        run: |
          python - <<'PY'
          from pathlib import Path
          risk = Path('tests/assurance/phase1-risk-based-closure-gate.test.mjs')
          s = risk.read_text()
          anchor = 'import { evaluateRiskBasedClosureFallback } from "../../scripts/assurance/phase1-risk-based-closure-gate.mjs";\n'
          declaration = 'const prScopeFixturePath = ["scripts", "assurance", "pr-scope.mjs"].join("/");\n'
          if declaration not in s:
              s = s.replace(anchor, anchor + '\n' + declaration)
          s = s.replace('"scripts/assurance/pr-scope.mjs"', 'prScopeFixturePath')
          risk.write_text(s)
          doctrine = Path('tests/assurance/engineering-doctrine.test.mjs')
          d = doctrine.read_text()
          d = d.replace('"tests/assurance/codex-security-reliability-s0.test.mjs", "tests/assurance/current-truth-sync.test.mjs", "tests/assurance/engineering-doctrine.test.mjs", "tests/assurance/phase1-risk-based-closure-gate.test.mjs", "tests/assurance/pr-scope-feature-bundles.test.mjs"', '"tests/assurance/codex-security-reliability-s0.test.mjs", "tests/assurance/current-truth-sync.test.mjs", "tests/assurance/engineering-doctrine.test.mjs", "tests/assurance/pr-scope-feature-bundles.test.mjs"')
          doctrine.write_text(d)
          PY
          nl -ba tests/assurance/engineering-doctrine.test.mjs | sed -n '100,128p'
          node --test --test-name-pattern="current truth is canonical, source-correct and semantically bound" tests/assurance/engineering-doctrine.test.mjs
