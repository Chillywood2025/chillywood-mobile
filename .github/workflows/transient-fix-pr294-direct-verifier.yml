name: Transient fix PR294 direct verifier expectation

on:
  push:
    branches:
      - chatgpt/assurance-baseline-sync-20260828
    paths:
      - .github/workflows/transient-fix-pr294-direct-verifier.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/assurance-baseline-sync-20260828
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Remove stale unauthorized direct-verifier expectation
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/assurance/engineering-doctrine.test.mjs')
          s = p.read_text()
          old = '"tests/assurance/codex-security-reliability-s0.test.mjs", "tests/assurance/current-truth-sync.test.mjs", "tests/assurance/engineering-doctrine.test.mjs", "tests/assurance/phase1-risk-based-closure-gate.test.mjs", "tests/assurance/pr-scope-feature-bundles.test.mjs"'
          new = '"tests/assurance/codex-security-reliability-s0.test.mjs", "tests/assurance/current-truth-sync.test.mjs", "tests/assurance/engineering-doctrine.test.mjs", "tests/assurance/pr-scope-feature-bundles.test.mjs"'
          if s.count(old) != 1:
              raise SystemExit(f'expected exactly one stale assertion, found {s.count(old)}')
          p.write_text(s.replace(old, new))
          PY
      - name: Verify exact focused doctrine test
        run: node --test --test-name-pattern="verification dependency closure includes the exact current direct verifiers" tests/assurance/engineering-doctrine.test.mjs
      - name: Commit repair and remove transient workflow
        run: |
          rm .github/workflows/transient-fix-pr294-direct-verifier.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/assurance/engineering-doctrine.test.mjs .github/workflows/transient-fix-pr294-direct-verifier.yml
          git diff --cached --check
          git commit -m "fix: align doctrine verifier expectation with canonical authorization"
          git push origin HEAD:chatgpt/assurance-baseline-sync-20260828
