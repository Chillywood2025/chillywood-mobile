name: Transient diagnose PR294 owner binding

on:
  push:
    branches:
      - chatgpt/assurance-baseline-sync-20260828
    paths:
      - .github/workflows/transient-fix-pr294-direct-verifier.yml

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/assurance-baseline-sync-20260828
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Print exact owner doctrine binding
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module - <<'NODE'
          import { observeDoctrineOwnerAuthority } from './scripts/assurance/engineering-closure.mjs';
          const owner = observeDoctrineOwnerAuthority();
          console.log(JSON.stringify({
            classification: owner.classification,
            authorizedVerificationPathExact: owner.authorizedVerificationPathExact,
            verificationCorrectionPathExact: owner.verificationCorrectionPathExact,
            verificationCorrectionCommentId: owner.verificationCorrectionCommentId,
            verificationCorrectionCommentCreatedAt: owner.verificationCorrectionCommentCreatedAt,
            verificationCorrectionBodyHash: owner.verificationCorrectionBodyHash,
            recomputedVerificationCorrectionBodyHash: owner.recomputedVerificationCorrectionBodyHash,
            verificationCorrectionReplayRejection: owner.verificationCorrectionReplayRejection,
            ok: owner.ok,
            findings: owner.findings
          }, null, 2));
          NODE
      - name: Run exact failing test
        env:
          GH_TOKEN: ${{ github.token }}
        run: node --test --test-name-pattern="active current-truth root is exact, canonical, and source-correct" tests/assurance/engineering-doctrine.test.mjs
