name: Transient protected-main current-truth repair

on:
  push:
    branches:
      - chatgpt/protected-main-current-truth-repair-20260827

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Repair exact protected-main checkpoint
        env:
          CHECKPOINT_SHA: 338e914f3ec15a375d382ab456df9d7cee58985b
          CHECKPOINT_TREE: a95a0d2e9dadac4a6f033c101aae7f403f77c96e
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$CHECKPOINT_SHA"
          test "$(git rev-parse "$CHECKPOINT_SHA^{tree}")" = "$CHECKPOINT_TREE"
          node <<'NODE'
          const fs = require('fs');
          const path = 'config/assurance/current-truth-v1.json';
          const record = JSON.parse(fs.readFileSync(path, 'utf8'));
          const checkpointSha = process.env.CHECKPOINT_SHA;
          const checkpointTree = process.env.CHECKPOINT_TREE;
          if (!record.protectedMainAuthority || typeof record.protectedMainAuthority !== 'object') {
            throw new Error('protectedMainAuthority missing');
          }
          record.mainSha = checkpointSha;
          record.protectedMainAuthority.checkpointSha = checkpointSha;
          record.protectedMainAuthority.checkpointTree = checkpointTree;
          fs.writeFileSync(path, JSON.stringify(record) + '\n');
          NODE
          if git diff --quiet -- config/assurance/current-truth-v1.json; then
            echo "Current-truth checkpoint already synchronized"
            exit 0
          fi
          git diff --check
          git config user.name "chatgpt-codex-connector[bot]"
          git config user.email "chatgpt-codex-connector[bot]@users.noreply.github.com"
          git add config/assurance/current-truth-v1.json
          git commit -m "fix: synchronize protected-main current truth"
          git push origin HEAD:chatgpt/protected-main-current-truth-repair-20260827
