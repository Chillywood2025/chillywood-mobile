name: iOS Production and Internal TestFlight

on:
  workflow_dispatch:
    inputs:
      action:
        description: Select the bounded release-lane action
        required: true
        default: build
        type: choice
        options:
          - build
          - submit-existing-build
      eas_build_id:
        description: Exact successful production build ID (required for submission)
        required: false
        type: string
      confirmation:
        description: Type BUILD_IOS_PRODUCTION or SUBMIT_INTERNAL_TESTFLIGHT
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ios-production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    if: >-
      (inputs.action == 'build' && inputs.confirmation == 'BUILD_IOS_PRODUCTION') ||
      (inputs.action == 'submit-existing-build' && inputs.confirmation == 'SUBMIT_INTERNAL_TESTFLIGHT' && inputs.eas_build_id != '')
    name: iOS Production / Validate
    runs-on: ubuntu-latest
    environment: ios-production
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install alert-automation dependencies for TypeScript
        run: npm ci --prefix ops/alert-automation

      - name: Validate repository and release policy
        env:
          CI: "1"
          EXPO_NO_DOTENV: "1"
          EXPO_NO_CLIENT_ENV_VARS: "1"
          EXPO_PUBLIC_SUPABASE_URL: "https://ci.invalid"
          EXPO_PUBLIC_SUPABASE_ANON_KEY: "ci-placeholder-not-a-secret"
          EXPO_PUBLIC_BETA_OPERATOR_ALLOWLIST: "ci@example.invalid"
          EXPO_PUBLIC_BETA_ENVIRONMENT: "closed-beta"
        run: |
          npm run lint
          npx tsc --noEmit
          npm run validate:runtime
          npm run guard:route-contracts
          npm run guard:payment-rail-policy
          npm run guard:notification-room-call-policy
          npm run guard:watch-party-livekit
          npm run guard:old-room-handling
          npm run guard:ios-config-policy
          npm run proof:ios-config
          npm run guard:apple-app-site-association
          npm run guard:ios-commerce-catalog
          npm run guard:ios-commerce-policy
          npm run proof:ios-commerce
          npm run test:premium-purchase-readiness
          npm run proof:ios-media-readiness
          npm run proof:ios-push-platform
          npm run guard:ios-native-call-policy
          npm run proof:ios-voip-policy
          npm run proof:ios-voip-token-lifecycle
          npm run guard:ios-privacy-manifest
          npm run guard:ios-release-workflows
          npx expo-doctor

  build:
    if: inputs.action == 'build'
    needs: validate
    name: iOS Production / Build App Store Archive
    runs-on: ubuntu-latest
    environment: ios-production
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@c7b66a9c327a43a8fa7c0158e7f30d6040d2481e # v8
        with:
          eas-version: 21.0.1
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build production App Store archive
        run: eas build --platform ios --profile production --non-interactive --wait --freeze-credentials

  submit-internal-testflight:
    if: inputs.action == 'submit-existing-build'
    needs: validate
    name: iOS Production / Submit Internal TestFlight
    runs-on: ubuntu-latest
    environment: ios-production
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@c7b66a9c327a43a8fa7c0158e7f30d6040d2481e # v8
        with:
          eas-version: 21.0.1
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Upload exact build to App Store Connect
        run: eas submit --platform ios --profile production --id "${{ inputs.eas_build_id }}" --groups "Chillywood Internal" --non-interactive --wait

      - name: Record bounded internal-test scope
        run: |
          {
            echo "### Internal TestFlight boundary"
            echo
            echo "Internal validation only. Push, native incoming calls, purchases, payouts, and live money remain disabled."
            echo
            echo "Set the same What to Test note in App Store Connect after processing. The EAS CLI flag is plan-gated and is intentionally not used here."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve release boundary
        run: |
          echo "Upload completed for internal TestFlight processing only."
          echo "This workflow never enables external testing or public App Store release."
