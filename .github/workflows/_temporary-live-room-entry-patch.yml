name: Temporary Live room entry source repair

on:
  push:
    branches:
      - "chatgpt/live-room-entry-end-to-end-v1"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/live-room-entry-end-to-end-v1
          fetch-depth: 0
      - name: Apply source repair
        env:
          PATCH_B64: 
        run: |
          echo "$PATCH_B64" | base64 --decode > /tmp/live-room-patch.py
          python3 /tmp/live-room-patch.py
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Close Live room entry lifecycle gaps"
          git push origin HEAD:chatgpt/live-room-entry-end-to-end-v1
