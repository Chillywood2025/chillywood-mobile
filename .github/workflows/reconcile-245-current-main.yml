name: Reconcile PR 245 current main
on:
  push:
    branches: [chatgpt/creator-money-production-readiness-ios-parity-v1]
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/creator-money-production-readiness-ios-parity-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Merge current main and resolve bounded conflicts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "chatgpt-codex-connector[bot]"
          git config user.email "chatgpt-codex-connector[bot]@users.noreply.github.com"
          git fetch origin main
          set +e
          git merge --no-commit --no-ff origin/main
          merge_status=$?
          set -e
          if [ "$merge_status" -ne 0 ]; then
            python3 - <<'PY'
          from pathlib import Path

          # Preserve all automatically merged non-conflicting content. For the
          # seven known conflicts, choose only the conflict hunks deliberately.
          choices = {
              '_lib/creatorMonetization.ts': 'ours',
              '_lib/creatorVideos.ts': 'theirs',
              '_lib/creatorVipPasses.ts': 'ours',
              '_lib/watchParty.ts': 'theirs',
              'scripts/test-cognitive-db-concurrency.mjs': 'theirs',
              'supabase/functions/livekit-token/index.ts': 'theirs',
              'supabase/tests/room_host_participant_block_check_test.sql': 'theirs',
          }

          def resolve_markers(path: str, choice: str):
              p = Path(path)
              text = p.read_text()
              out = []
              pos = 0
              while True:
                  start = text.find('<<<<<<< HEAD\n', pos)
                  if start < 0:
                      out.append(text[pos:])
                      break
                  out.append(text[pos:start])
                  mid = text.find('=======\n', start)
                  end = text.find('>>>>>>> ', mid)
                  if mid < 0 or end < 0:
                      raise RuntimeError(f'malformed conflict markers in {path}')
                  endline = text.find('\n', end)
                  if endline < 0:
                      endline = len(text) - 1
                  ours = text[start + len('<<<<<<< HEAD\n'):mid]
                  theirs = text[mid + len('=======\n'):end]
                  out.append(ours if choice == 'ours' else theirs)
                  pos = endline + 1
              resolved = ''.join(out)
              if '<<<<<<< ' in resolved or '\n=======\n' in resolved or '>>>>>>> ' in resolved:
                  raise RuntimeError(f'unresolved markers remain in {path}')
              p.write_text(resolved)

          for path, choice in choices.items():
              resolve_markers(path, choice)
          PY
          fi

          # Reconcile #245's strict VIP Pass authority with today's VIP-video
          # shelf helpers. The strict purchase/session validation remains from
          # #245; these helpers add video-scoped VIP authority only.
          python3 - <<'PY'
          from pathlib import Path

          p = Path('_lib/creatorVipPasses.ts')
          s = p.read_text()
          if 'export type CreatorVipVideoAccess' not in s:
              anchor = 'export type CreatorVipTransaction = {\n'
              block = '''export type CreatorVipVideoAccess = {\n  allowed: boolean;\n  reason: string;\n  vipRequired: boolean;\n  creatorId: string | null;\n};\n\n'''
              if anchor not in s:
                  raise RuntimeError('VIP video type insertion anchor missing')
              s = s.replace(anchor, block + anchor, 1)
          if 'export async function resolveCreatorVipVideoAccess' not in s:
              anchor = 'export async function createCreatorVipPassPurchaseIntent(\n'
              block = '''export async function resolveCreatorVipVideoAccess(videoId: string): Promise<CreatorVipVideoAccess> {\n  const { data, error } = await rpcClient.rpc("resolve_creator_vip_video_access", { p_video_id: videoId });\n  if (error || !data || typeof data !== "object" || Array.isArray(data)) {\n    return { allowed: false, reason: "access_check_failed", vipRequired: true, creatorId: null };\n  }\n  const row = data as Record<string, unknown>;\n  if (typeof row.allowed !== "boolean" || typeof row.vipRequired !== "boolean") {\n    return { allowed: false, reason: "malformed_access_response", vipRequired: true, creatorId: null };\n  }\n  const creatorId = accessText(row.creatorId);\n  if (creatorId && !ACCESS_UUID_PATTERN.test(creatorId)) {\n    return { allowed: false, reason: "malformed_access_response", vipRequired: true, creatorId: null };\n  }\n  const reason = accessText(row.reason);\n  if (!reason) return { allowed: false, reason: "malformed_access_response", vipRequired: true, creatorId: null };\n  return { allowed: row.allowed, reason, vipRequired: row.vipRequired, creatorId: creatorId || null };\n}\n\nexport async function setCreatorVideoVipAccess(videoId: string, required: boolean) {\n  const { data, error } = await rpcClient.rpc("set_creator_video_vip_access", {\n    p_video_id: videoId,\n    p_required: required,\n  });\n  if (error) throw new Error("VIP video access could not be updated.");\n  const row = data && typeof data === "object" && !Array.isArray(data) ? data as Record<string, unknown> : {};\n  if (accessText(row.status) !== "ok") {\n    if (accessText(row.reason) === "vip_video_must_be_public") {\n      throw new Error("Make this video Public before adding it to the VIP shelf.");\n    }\n    throw new Error("VIP video access could not be updated.");\n  }\n  const returnedVideoId = accessText(row.videoId);\n  if (!ACCESS_UUID_PATTERN.test(returnedVideoId) || returnedVideoId !== videoId || typeof row.vipRequired !== "boolean") {\n    throw new Error("VIP video access could not be verified.");\n  }\n  return { videoId: returnedVideoId, vipRequired: row.vipRequired };\n}\n\n'''
              if anchor not in s:
                  raise RuntimeError('VIP helper insertion anchor missing')
              s = s.replace(anchor, block + anchor, 1)
          p.write_text(s)
          PY

          # Current main owns the latest creator-video model/shelf fields. Add
          # #245's stronger pre-row money authority so protected metadata is not
          # selected until VIP or paid-video access is verified.
          python3 - <<'PY'
          from pathlib import Path
          p = Path('_lib/creatorVideos.ts')
          s = p.read_text()
          if 'function createPaidContentLockedCreatorVideo(' not in s:
              anchor = 'export async function readCreatorVideoForPlayer(videoId: string): Promise<CreatorVideo | null> {\n'
              helpers = '''function createPaidContentLockedCreatorVideo(\n  videoId: string,\n  access: CreatorContentAccessResolution,\n): CreatorVideo {\n  const purchaseRequired = access.resolverStatus === "resolved"\n    && access.allowed === false\n    && access.reason === "purchase_required"\n    && access.requiresPurchase === true;\n  const now = new Date().toISOString();\n  return {\n    id: videoId, ownerId: purchaseRequired ? access.creatorId ?? "" : "",\n    title: purchaseRequired ? "Paid creator video" : "Creator video unavailable",\n    description: purchaseRequired ? "Purchase access must be verified before this creator video can play." : "Playback remains blocked until paid-content access can be verified.",\n    visibility: "public", moderationStatus: "clean", moderationReason: null, moderatedAt: null, moderatedBy: null,\n    playbackUrl: "", thumbnailUrl: "", storageProvider: "supabase", storageBucket: "", storageObjectKey: "", storagePath: "", thumbStoragePath: "", mimeType: "", fileSizeBytes: null,\n    playbackResolution: createUnavailableVodPlaybackResolution(videoId, access.reason), playbackQualityLabel: null, playbackDelivery: null,\n    paidContentAccess: access, vipAccessRequired: false, vipAccess: null, visibilityAccess: null, renditionStatuses: [], publicClipMetadata: null, createdAt: now, updatedAt: now,\n  };\n}\n\nfunction createVipLockedCreatorVideo(\n  videoId: string,\n  access: CreatorVipVideoAccess,\n): CreatorVideo {\n  const now = new Date().toISOString();\n  return {\n    id: videoId, ownerId: access.creatorId ?? "", title: "VIP creator video",\n    description: "Active VIP access for this creator is required before this video can play.",\n    visibility: "public", moderationStatus: "clean", moderationReason: null, moderatedAt: null, moderatedBy: null,\n    playbackUrl: "", thumbnailUrl: "", storageProvider: "supabase", storageBucket: "", storageObjectKey: "", storagePath: "", thumbStoragePath: "", mimeType: "", fileSizeBytes: null,\n    playbackResolution: createUnavailableVodPlaybackResolution(videoId, access.reason), playbackQualityLabel: null, playbackDelivery: null,\n    paidContentAccess: null, vipAccessRequired: true, vipAccess: access, visibilityAccess: null, renditionStatuses: [], publicClipMetadata: null, createdAt: now, updatedAt: now,\n  };\n}\n\n'''
              if anchor not in s:
                  raise RuntimeError('creator video helper anchor missing')
              s = s.replace(anchor, helpers + anchor, 1)

          start = s.index('export async function readCreatorVideoForPlayer(videoId: string): Promise<CreatorVideo | null> {')
          end = s.index('\nexport async function uploadCreatorVideo(', start)
          old = s[start:end]
          new = '''export async function readCreatorVideoForPlayer(videoId: string): Promise<CreatorVideo | null> {\n  const normalizedVideoId = toText(videoId);\n  if (!normalizedVideoId) return null;\n\n  const visibilityAccess = await resolveCreatorVideoVisibilityAccess(normalizedVideoId).catch(() => null);\n  if (visibilityAccess && !visibilityAccess.allowed) {\n    return createLockedCreatorVideo(normalizedVideoId, visibilityAccess);\n  }\n\n  // Classify VIP authority before selecting the protected video row. A failed\n  // classification is treated as potentially VIP-protected and therefore locked.\n  const vipAccess = await resolveCreatorVipVideoAccess(normalizedVideoId).catch(() => ({\n    allowed: false, reason: "access_check_failed", vipRequired: true, creatorId: null,\n  }));\n  if (vipAccess.vipRequired && vipAccess.allowed !== true) {\n    return createVipLockedCreatorVideo(normalizedVideoId, vipAccess);\n  }\n\n  // VIP and per-video paid access are mutually exclusive. Non-VIP videos must\n  // pass the #245 paid-content resolver before any protected source metadata is read.\n  const paidContentAccess = vipAccess.vipRequired\n    ? null\n    : await resolveCreatorContentAccess({ contentType: "creator_video", contentId: normalizedVideoId });\n  if (paidContentAccess && (paidContentAccess.resolverStatus !== "resolved" || paidContentAccess.allowed !== true)) {\n    return createPaidContentLockedCreatorVideo(normalizedVideoId, paidContentAccess);\n  }\n\n  const { data, error } = await supabase\n    .from("videos")\n    .select(CREATOR_VIDEO_SELECT)\n    .eq("id", normalizedVideoId)\n    .in("moderation_status", ["clean", "reported"])\n    .returns<CreatorVideoRow>()\n    .maybeSingle();\n  if (error || !data) return null;\n  const row = data as CreatorVideoRow;\n  const parsed = await parseCreatorVideo(row, { resolveLegacyPlaybackUrl: false });\n\n  // Fail closed if database classification changed between preflight and row read.\n  if (parsed.vipAccessRequired !== vipAccess.vipRequired) {\n    return createVipLockedCreatorVideo(normalizedVideoId, {\n      allowed: false, reason: "vip_classification_changed", vipRequired: true, creatorId: parsed.ownerId || vipAccess.creatorId,\n    });\n  }\n\n  const parsedWithAccess = {\n    ...parsed,\n    visibilityAccess: visibilityAccess ?? {\n      allowed: true,\n      visibility: parsed.visibility,\n      reason: parsed.visibility === "circle" ? "circle_member_allowed" as const : "public_allowed" as const,\n      isOwner: false, isBlocked: false, isCircleMember: parsed.visibility === "circle",\n      hasPlayableSource: !!(parsed.storagePath || parsed.storageObjectKey), viewerUserId: null, ownerUserId: parsed.ownerId,\n    },\n  };\n\n  const { data: authData } = await supabase.auth.getUser().catch(() => ({ data: { user: null } }));\n  const viewerUserId = toText(authData.user?.id);\n  const viewerOwnsVideo = !!viewerUserId && viewerUserId === parsedWithAccess.ownerId;\n  if (parsedWithAccess.visibility === "draft" && !viewerOwnsVideo) {\n    return createLockedCreatorVideo(normalizedVideoId, {\n      allowed: false, visibility: "draft", reason: "draft_owner_only", isOwner: false, isBlocked: false,\n      isCircleMember: false, hasPlayableSource: false, viewerUserId: viewerUserId || null, ownerUserId: parsedWithAccess.ownerId,\n    });\n  }\n\n  const playbackResolution = await resolveSignedVideoPlaybackSource({\n    videoId: parsedWithAccess.id, storageProvider: parsedWithAccess.storageProvider, fallbackBucket: parsedWithAccess.storageBucket,\n  });\n  const legacyPlaybackUrl = !playbackResolution.defaultPlaybackUrl && (\n    playbackResolution.legacyPlaybackAllowed || playbackResolution.legacyQualityEnforcement === "resolver_unavailable"\n  ) ? await createCreatorVideoPlaybackUrl({\n    id: parsedWithAccess.id, storageProvider: parsedWithAccess.storageProvider, storageBucket: parsedWithAccess.storageBucket,\n    storageObjectKey: parsedWithAccess.storageObjectKey, storagePath: parsedWithAccess.storagePath, playbackUrl: toText(row.playback_url),\n  }) : "";\n\n  return {\n    ...parsedWithAccess, vipAccess: vipAccess.vipRequired ? vipAccess : null,\n    playbackUrl: playbackResolution.defaultPlaybackUrl || legacyPlaybackUrl, playbackResolution,\n    playbackQualityLabel: playbackResolution.defaultPlaybackQuality ?? (legacyPlaybackUrl ? "legacy_single_file" : null),\n    playbackDelivery: playbackResolution.deliveryMetadata, paidContentAccess,\n    renditionStatuses: playbackResolution.renditionStatuses.length ? playbackResolution.renditionStatuses : parsed.renditionStatuses,\n  };\n}\n'''
          s = s[:start] + new + s[end:]
          p.write_text(s)
          PY

          # Make Player distinguish VIP lock from paid-content failure after the
          # otherwise clean auto-merge of #245 and current main.
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/player/[id].tsx')
          s = p.read_text()
          needle = '  const creatorVideoPaidContentLocked = isCreatorVideoPlayback\n'
          if needle in s and 'const creatorVideoVipLocked' not in s:
              s = s.replace(needle, '  const creatorVideoVipLocked = isCreatorVideoPlayback\n    && creatorVideo?.vipAccessRequired === true\n    && creatorVideo.vipAccess?.allowed !== true;\n  const creatorVideoPaidContentLocked = isCreatorVideoPlayback\n    && creatorVideo?.vipAccessRequired !== true\n', 1)
          generic = '? "Playback is blocked because paid-content access could not be verified."\n'
          if generic in s and 'VIP access for this creator is required to play this video.' not in s:
              s = s.replace(generic, '? "Playback is blocked because paid-content access could not be verified."\n                        : creatorVideoVipLocked\n                          ? "VIP access for this creator is required to play this video."\n', 1)
          p.write_text(s)
          PY

          git add -A
          if git diff --name-only --diff-filter=U | grep -q .; then
            echo "Unresolved merge conflicts remain:" >&2
            git diff --name-only --diff-filter=U >&2
            exit 1
          fi
      - run: npm ci
      - run: npm ci --prefix ops/alert-automation
      - name: Verify money and entitlement reconciliation
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck
          node tests/creator-money/client-access-normalizers.test.mjs
          node tests/creator-money/client-precharge-authority.test.mjs
          node tests/creator-money/ios-production-readiness.test.mjs
          node tests/creator-money/paid-video-playback-authority.test.mjs
          node tests/creator-money/revenuecat-google-play-provenance.test.mjs
          node tests/wave1/paid-watch-party-ticket-admission.test.mjs
          node scripts/guard-vip-video-shelf-v1.mjs
          node scripts/guard-creator-monetization-policy.mjs
          npm run guard:route-contracts
          git diff --check
      - name: Commit reconciled source and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/reconcile-245-current-main.yml
          git add -A
          git commit -m "Reconcile creator money with current entitlement truth"
          git push origin HEAD:chatgpt/creator-money-production-readiness-ios-parity-v1
