name: Reconcile PR 245 current main
on:
  push:
    branches: [chatgpt/creator-money-production-readiness-ios-parity-v1]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/creator-money-production-readiness-ios-parity-v1
          fetch-depth: 0
      - name: Diagnose merge conflicts with current main
        shell: bash
        run: |
          set +e
          git fetch origin main
          git merge --no-commit --no-ff origin/main
          status=$?
          echo "MERGE_STATUS=$status"
          echo "UNMERGED_BEGIN"
          git diff --name-only --diff-filter=U
          echo "UNMERGED_END"
          git merge --abort || true
          exit 0
