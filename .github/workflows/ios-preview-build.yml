name: iOS Preview Build

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type BUILD_IOS_PREVIEW to start a non-production internal build
        required: true
        type: string

permissions:
  checks: read
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: ios-preview-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'BUILD_IOS_PREVIEW'
    name: iOS Preview / Validate
    runs-on: ubuntu-latest
    environment: ios-preview
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Deny build while late Codex Review findings are unresolved
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/assurance/late-review-sentinel.mjs --require-github

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install alert-automation dependencies for TypeScript
        run: npm ci --prefix ops/alert-automation

      - name: Validate repository and iOS policy
        env:
          CI: "1"
          EXPO_NO_DOTENV: "1"
          EXPO_NO_CLIENT_ENV_VARS: "1"
          EXPO_PUBLIC_SUPABASE_URL: "https://ci.invalid"
          EXPO_PUBLIC_SUPABASE_ANON_KEY: "ci-placeholder-not-a-secret"
          EXPO_PUBLIC_BETA_OPERATOR_ALLOWLIST: "ci@example.invalid"
          EXPO_PUBLIC_BETA_ENVIRONMENT: "closed-beta"
        run: |
          npm run lint
          npx tsc --noEmit
          npm run validate:runtime
          npm run guard:route-contracts
          npm run guard:payment-rail-policy
          npm run guard:notification-room-call-policy
          npm run guard:watch-party-livekit
          npm run guard:old-room-handling
          npm run guard:ios-config-policy
          npm run proof:ios-config
          npm run guard:apple-app-site-association
          npm run guard:ios-commerce-catalog
          npm run guard:ios-commerce-policy
          npm run proof:ios-commerce
          npm run test:premium-purchase-readiness
          npm run proof:ios-media-readiness
          npm run proof:ios-push-platform
          npm run guard:ios-native-call-policy
          npm run proof:ios-voip-policy
          npm run proof:ios-voip-token-lifecycle
          npm run guard:ios-privacy-manifest
          npm run guard:ios-release-workflows
          npx expo-doctor

  build:
    needs: validate
    name: iOS Preview / Build
    runs-on: ubuntu-latest
    environment: ios-preview
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@c7b66a9c327a43a8fa7c0158e7f30d6040d2481e # v8
        with:
          eas-version: 21.0.1
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build iOS preview artifact
        run: eas build --platform ios --profile preview --non-interactive --wait
