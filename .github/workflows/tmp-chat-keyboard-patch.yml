name: Temporary Chi'lly Chat keyboard patch

on:
  push:
    branches:
      - chatgpt/chilly-chat-operational-repair-20260830

permissions:
  contents: write

jobs:
  patch:
    if: github.actor == 'Chillywood2025'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: chatgpt/chilly-chat-operational-repair-20260830
          fetch-depth: 0
      - name: Apply exact keyboard-layout correction
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/chat/[threadId].tsx')
          text = path.read_text()
          old = '''  composerKeyboardDocked: {\n    position: "absolute",\n    left: 0,\n    right: 0,\n    bottom: 0,\n  },'''
          new = '''  composerKeyboardDocked: {\n    // KeyboardAvoidingView already owns Android keyboard-height compensation.\n    // Keep the composer in normal flow so the input stays visible above the keyboard.\n    position: "relative",\n  },'''
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one composer docking block, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check
          git diff -- app/chat/'[threadId].tsx'
      - name: Commit correction and remove temporary helper
        shell: bash
        run: |
          git config user.name "chillywood-chatgpt-repair"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/tmp-chat-keyboard-patch.yml
          git add app/chat/'[threadId].tsx'
          test -n "$(git status --porcelain)"
          git commit -m "Fix Chi'lly Chat keyboard composer docking"
          git push origin HEAD:chatgpt/chilly-chat-operational-repair-20260830
