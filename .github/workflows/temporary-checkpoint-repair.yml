name: Temporary protected-main checkpoint repair

on:
  push:
    branches:
      - chatgpt/protected-main-checkpoint-88e715

permissions:
  contents: write

jobs:
  repair:
    if: github.actor == 'Chillywood2025'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/protected-main-checkpoint-88e715
      - name: Advance protected-main checkpoint only
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path = 'config/assurance/current-truth-v1.json';
          const record = JSON.parse(fs.readFileSync(path, 'utf8'));
          record.mainSha = '88e71568555161dc629197fc7e4b3787e9ed56a7';
          record.protectedMainAuthority.checkpointSha = '88e71568555161dc629197fc7e4b3787e9ed56a7';
          record.protectedMainAuthority.checkpointTree = 'c1877737f14f73c177004c6e17a9b957b556f3d9';
          const stableJson = (value) => {
            if (Array.isArray(value)) return `[${value.map(stableJson).join(',')}]`;
            if (value && typeof value === 'object') return `{${Object.keys(value).sort().map((key) => `${JSON.stringify(key)}:${stableJson(value[key])}`).join(',')}}`;
            return JSON.stringify(value);
          };
          fs.writeFileSync(path, `${stableJson(record)}\n`);
          NODE
          git diff --exit-code -- . ':!config/assurance/current-truth-v1.json' || exit 1
          test "$(git diff --name-only)" = "config/assurance/current-truth-v1.json"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add config/assurance/current-truth-v1.json
          git commit -m "chore: advance protected-main checkpoint"
          git push origin HEAD:chatgpt/protected-main-checkpoint-88e715
