appId: ${CHILLYWOOD_APP_ID}
---
- launchApp:
    clearState: true
- assertVisible:
    id: "app-root-ready"
    optional: true
- openLink: "chillywoodmobile://login"
- assertVisible:
    id: "auth-login-email-input"
- tapOn:
    id: "auth-login-email-input"
- inputText: "${CHILLYWOOD_E2E_OWNER_EMAIL}"
- tapOn:
    id: "auth-login-password-input"
- inputText: "${CHILLYWOOD_E2E_OWNER_PASSWORD}"
- hideKeyboard
- tapOn:
    id: "auth-login-submit-button"
- extendedWaitUntil:
    visible:
      id: "auth-logged-in-home"
    timeout: 30000
- openLink: "chillywoodmobile://channel/${CHILLYWOOD_E2E_CREATOR_ID}"
- assertVisible:
    id: "screen-platform"
- assertVisible:
    id: "platform-owner-mode-badge"
- scrollUntilVisible:
    element:
      id: "platform-creator-offers-section"
    direction: DOWN
    timeout: 20000
- assertVisible:
    id: "platform-creator-offers-section"
- scrollUntilVisible:
    element:
      id: "platform-owner-manage-subscription-button"
    direction: DOWN
    timeout: 20000
- assertVisible:
    id: "platform-owner-manage-subscription-button"
- scrollUntilVisible:
    element:
      id: "platform-owner-manage-vip-button"
    direction: DOWN
    timeout: 20000
- assertVisible:
    id: "platform-owner-manage-vip-button"
- assertNotVisible:
    id: "platform-support-this-platform-section"
- assertNotVisible:
    id: "premium-purchase-button"
- takeScreenshot: "monetization-owner-cannot-buy-own-offers"
