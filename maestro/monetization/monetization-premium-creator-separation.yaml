appId: ${CHILLYWOOD_APP_ID}
---
- launchApp:
    clearState: true
- assertVisible:
    id: "app-root-ready"
    optional: true
- openLink: "chillywoodmobile://login"
- assertVisible:
    id: "auth-login-email-input"
- tapOn:
    id: "auth-login-email-input"
- inputText: "${CHILLYWOOD_E2E_OWNER_EMAIL}"
- tapOn:
    id: "auth-login-password-input"
- inputText: "${CHILLYWOOD_E2E_OWNER_PASSWORD}"
- hideKeyboard
- tapOn:
    id: "auth-login-submit-button"
- extendedWaitUntil:
    visible:
      id: "auth-logged-in-home"
    timeout: 30000
- openLink: "chillywoodmobile://subscribe"
- assertVisible:
    id: "premium-screen"
- assertVisible:
    id: "premium-not-creator-offer-copy"
- openLink: "chillywoodmobile://channel-subscription/${CHILLYWOOD_E2E_CREATOR_ID}"
- assertVisible:
    id: "screen-channel-subscription"
- assertVisible:
    id: "subscriber-area-owner-preview-badge"
- assertVisible:
    id: "subscriber-area-does-not-include-list"
- openLink: "chillywoodmobile://vip-pass/${CHILLYWOOD_E2E_CREATOR_ID}"
- assertVisible:
    id: "screen-vip-pass"
- assertVisible:
    id: "vip-area-owner-preview-badge"
- assertVisible:
    id: "vip-area-does-not-include-list"
- takeScreenshot: "monetization-premium-creator-separation"
