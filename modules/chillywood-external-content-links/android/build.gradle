plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.chillywoodexternalcontentlinks'
version = '1.0.0'

android {
  namespace 'expo.modules.chillywoodexternalcontentlinks'
  defaultConfig {
    minSdkVersion 24
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  // Shared with RevenueCat: fail dependency resolution rather than silently
  // changing the reviewed Billing SDK version under either purchase path.
  implementation('com.android.billingclient:billing:8.2.1') {
    version { strictly '8.2.1' }
  }
}
