plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}
group = 'expo.modules.chillywoodteststore'
version = '1.0.0'
android {
  namespace 'expo.modules.chillywoodteststore'
  buildFeatures { buildConfig true }
  defaultConfig {
    minSdkVersion 24
    versionCode 1
    versionName '1.0.0'
  }
}
dependencies {
  implementation('com.revenuecat.purchases:purchases:10.28.1') {
    version { strictly '10.28.1' }
  }
}
