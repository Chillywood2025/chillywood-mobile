plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.chillywoodcameraeffects'
version = '1.0.0'

android {
  namespace 'expo.modules.chillywoodcameraeffects'
  defaultConfig {
    minSdkVersion 24
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  // This is the name emitted by React Native autolinking for the pinned fork.
  implementation project(':livekit_react-native-webrtc')
  // Standalone application runtime only. Never replace with Play Services or
  // MediaPipe Tasks: their published artifacts include remote diagnostics.
  implementation 'com.google.ai.edge.litert:litert:1.4.1'
  implementation 'com.google.ai.edge.litert:litert-api:1.4.1'
}
